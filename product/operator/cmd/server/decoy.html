<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1d414d" />
    <title>EduSigh | Attendance, eventually</title>
    <link rel="icon" href="/favicon.png" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@700&family=Inter:wght@400;500;600&display=swap"
    />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        min-height: 100vh;
        background: #fff;
        color: #363636;
        font-family: Inter, -apple-system, BlinkMacSystemFont, sans-serif;
      }

      header {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 44px;
        background: #1d414d;
      }

      .logo {
        color: #fff;
        cursor: default;
        font-family: Nunito, sans-serif;
        font-size: 20px;
        font-weight: 700;
        letter-spacing: -0.01em;
        user-select: none;
      }

      .help-btn {
        position: absolute;
        right: 16px;
        display: grid;
        width: 24px;
        height: 24px;
        place-items: center;
        border: 1.5px solid rgba(255, 255, 255, 0.45);
        border-radius: 50%;
        color: rgba(255, 255, 255, 0.6);
        cursor: pointer;
        font-size: 12px;
        font-weight: 700;
      }

      main {
        display: flex;
        flex-direction: column;
        align-items: center;
        max-width: 540px;
        margin: 0 auto;
        padding: 40px 24px 80px;
      }

      h1 {
        margin-bottom: 6px;
        font-family: Nunito, sans-serif;
        font-size: 30px;
        font-weight: 700;
        text-align: center;
      }

      .subtitle {
        margin-bottom: 24px;
        color: #363636;
        font-size: 15px;
        line-height: 1.5;
        text-align: center;
      }

      .illustration {
        display: flex;
        align-items: flex-end;
        justify-content: center;
        height: 150px;
        margin-bottom: 32px;
      }

      .separator {
        width: 100%;
        height: 1px;
        margin-bottom: 32px;
        background: #e7e7e7;
      }

      form {
        width: 100%;
        max-width: 380px;
      }

      .form-group {
        position: relative;
        width: 100%;
        margin-bottom: 24px;
      }

      .form-group svg {
        position: absolute;
        top: 50%;
        left: 14px;
        color: #8e8e8e;
        transform: translateY(-50%);
      }

      input[type="email"] {
        width: 100%;
        padding: 11px 14px 11px 40px;
        border: 0.8px solid #e7e7e7;
        border-radius: 5px;
        background: #fff;
        color: #363636;
        font-family: inherit;
        font-size: 14px;
        outline: none;
        transition: border-color 0.2s;
      }

      input[type="email"]::placeholder {
        color: #aaa;
      }

      input[type="email"]:focus {
        border-color: #1d414d;
      }

      .app-banner {
        display: flex;
        flex-direction: column;
        gap: 10px;
        width: 100%;
        margin-bottom: 40px;
        padding: 14px 16px;
        border: 1px solid #e7e7e7;
        border-radius: 10px;
      }

      .app-banner-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .app-banner-text {
        font-size: 14px;
        font-weight: 500;
      }

      .app-banner-close {
        display: grid;
        width: 20px;
        height: 20px;
        place-items: center;
        border: none;
        background: none;
        color: #999;
        cursor: pointer;
        font-size: 16px;
        line-height: 1;
      }

      .app-banner-link {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        width: 100%;
        padding: 11px;
        border: none;
        border-radius: 8px;
        background: #ffd88b;
        color: #363636;
        cursor: pointer;
        font-family: inherit;
        font-size: 14px;
        font-weight: 600;
        text-decoration: none;
        transition: background 0.15s;
      }

      .app-banner-link:hover {
        background: #ffce6e;
      }

      .btn-continue {
        width: 100%;
        margin-bottom: 14px;
        padding: 13px;
        border: none;
        border-radius: 10px;
        background: #ffd88b;
        color: #363636;
        cursor: default;
        font-family: inherit;
        font-size: 15px;
        font-weight: 600;
        opacity: 0.4;
        transition:
          opacity 0.2s,
          background 0.15s;
      }

      .btn-continue.active {
        cursor: pointer;
        opacity: 1;
      }

      .btn-continue.active:hover {
        background: #ffce6e;
      }

      .login-actions {
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 100%;
        max-width: 380px;
      }

      .btn-microsoft {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        width: 100%;
        margin-bottom: 18px;
        padding: 13px;
        border: 1px solid #e7e7e7;
        border-radius: 10px;
        background: #fff;
        color: #363636;
        cursor: pointer;
        font-family: inherit;
        font-size: 14px;
        font-weight: 500;
        transition: background 0.15s;
      }

      .btn-microsoft:hover {
        background: #f9f9f9;
      }

      .ms-icon {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 2px;
        width: 16px;
        height: 16px;
      }

      .ms-icon span:nth-child(1) {
        background: #f25022;
      }

      .ms-icon span:nth-child(2) {
        background: #7fba00;
      }

      .ms-icon span:nth-child(3) {
        background: #00a4ef;
      }

      .ms-icon span:nth-child(4) {
        background: #ffb900;
      }

      .other-options {
        color: #2778c4;
        font-size: 14px;
        font-weight: 500;
        text-decoration: none;
      }

      .other-options:hover {
        text-decoration: underline;
      }

      footer {
        padding: 20px;
        color: #bbb;
        font-size: 11px;
        text-align: center;
      }

      .ngl-toast {
        position: fixed;
        bottom: 30px;
        left: 50%;
        padding: 12px 24px;
        border-radius: 8px;
        background: #1d414d;
        color: #ffd88b;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.02em;
        opacity: 0;
        transform: translateX(-50%) translateY(20px);
        transition:
          opacity 0.4s,
          transform 0.4s;
        pointer-events: none;
      }

      .ngl-toast.show {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }
    </style>
  </head>
  <body>
    <header>
      <span class="logo" id="logo">edusigh</span>
      <span class="help-btn" aria-label="Help">?</span>
    </header>

    <main>
      <h1>Login</h1>
      <p class="subtitle">
        No need for an attendance sheet<br />
        use your phone and get started!
      </p>

      <div class="illustration" aria-hidden="true">
        <svg width="150" height="150" viewBox="0 0 150 150" fill="none">
          <g transform="rotate(-12, 48, 80)">
            <rect x="12" y="10" width="62" height="110" rx="11" fill="#fff" stroke="#3a3a3a" stroke-width="2"/>
            <rect x="32" y="14" width="22" height="3" rx="1.5" fill="#ddd"/>
            <rect x="18" y="24" width="50" height="50" rx="3" fill="#ffd88b"/>
            <circle cx="30" cy="62" r="7" fill="#f5c84c"/>
            <rect x="18" y="82" width="50" height="3" rx="1.5" fill="#e5e5e5"/>
            <rect x="18" y="89" width="35" height="3" rx="1.5" fill="#e5e5e5"/>
            <rect x="18" y="96" width="42" height="3" rx="1.5" fill="#e5e5e5"/>
          </g>
          <g transform="translate(90, 10)">
            <circle cx="22" cy="14" r="10" fill="#3a3a3a"/>
            <circle cx="22" cy="17" r="8.5" fill="#c68e5b"/>
            <path d="M13.5 11c0-7 17-7 17 0v3c0-5-17-5-17 0z" fill="#3a3a3a"/>
            <rect x="18" y="26" width="8" height="5" rx="3" fill="#c68e5b"/>
            <path d="M13 30h18c3.5 0 6 3 6 6v22c0 1.5-1 3-3 3H10c-2 0-3-1.5-3-3V36c0-3 2.5-6 6-6z" fill="#3a3a3a"/>
            <rect x="13" y="60" width="9" height="38" rx="4.5" fill="#3a3a3a"/>
            <rect x="22" y="60" width="9" height="38" rx="4.5" fill="#3a3a3a"/>
            <ellipse cx="17" cy="99" rx="6" ry="3.5" fill="#5a4030"/>
            <ellipse cx="27" cy="99" rx="6" ry="3.5" fill="#5a4030"/>
            <path d="M9 38c-5 2-12 8-16 16" stroke="#c68e5b" stroke-width="4.5" stroke-linecap="round"/>
            <path d="M35 40c4 2 6 8 5 16" stroke="#c68e5b" stroke-width="4.5" stroke-linecap="round"/>
          </g>
          <circle cx="62" cy="6" r="3" fill="#ffd88b"/>
          <circle cx="74" cy="3" r="2" fill="#ddd"/>
        </svg>
      </div>

      <div class="separator"></div>

      <form id="login-form" autocomplete="off">
        <div class="form-group">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
            <rect
              x="1"
              y="3"
              width="14"
              height="10"
              rx="2"
              stroke="currentColor"
              stroke-width="1.5"
            />
            <path
              d="M1 5l7 4 7-4"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
            />
          </svg>
          <input
            type="email"
            id="email"
            placeholder="Email or learner username"
            autocomplete="off"
          />
        </div>

        <div class="app-banner" id="app-banner">
          <div class="app-banner-header">
            <span class="app-banner-text">Edusigh, in your pocket.</span>
            <button
              type="button"
              class="app-banner-close"
              id="close-banner"
              aria-label="Close"
            >
              x
            </button>
          </div>
          <a href="#" class="app-banner-link" id="app-link">
            Download the app
            <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
              <path
                d="M3 9l6-6M9 3v6M9 3H3"
                stroke="currentColor"
                stroke-width="1.5"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </a>
        </div>

        <button type="submit" class="btn-continue" id="btn-continue">
          Continue
        </button>
      </form>

      <div class="login-actions">
        <button class="btn-microsoft">
          <span class="ms-icon">
            <span></span><span></span><span></span><span></span>
          </span>
          Login with Microsoft
        </button>

        <a href="#" class="other-options" id="other-link">Other options</a>
      </div>
    </main>

    <footer>EduSigh is not EduSign. Pedro sends his regards.</footer>

    <div class="ngl-toast" id="ngl"></div>
    <script>
      !(function () {
        var email = document.getElementById("email");
        var btn = document.getElementById("btn-continue");
        email.addEventListener("input", function () {
          btn.classList.toggle("active", email.value.trim().length > 0);
        });
        document.getElementById("login-form").addEventListener(
          "submit",
          function (e) {
            e.preventDefault();
          },
        );
        document
          .getElementById("close-banner")
          .addEventListener("click", function () {
            document.getElementById("app-banner").style.display = "none";
          });
        document
          .getElementById("app-link")
          .addEventListener("click", function (e) {
            e.preventDefault();
          });
        document
          .getElementById("other-link")
          .addEventListener("click", function (e) {
            e.preventDefault();
          });
        var n = 0,
          t = 0,
          msgs = [
            "NGL: Not Gonna Locate (your attendance)",
            "NGL: your geolocation is now ours",
            "NGL: Nice Geolocation, Loser",
            "NGL stands for NeoGeoLoc, obviously",
            "attendance is just government-grade NGL",
            "NGL: we know where you aren't",
            "if you're reading this, you're already geolocated",
          ];
        document.getElementById("logo").addEventListener("click", function () {
          var now = Date.now();
          if (now - t > 2000) n = 0;
          t = now;
          if (++n >= 7) {
            n = 0;
            var el = document.getElementById("ngl");
            el.textContent = msgs[(Math.random() * msgs.length) | 0];
            el.classList.add("show");
            setTimeout(function () {
              el.classList.remove("show");
            }, 3000);
          }
        });
      })();
    </script>
  </body>
</html>
