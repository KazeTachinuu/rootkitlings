[[assumptions]]
concept = "c-functions-and-errors"
competency = "Read small C functions, control flow, return values, and compiler diagnostics."

[[assumptions]]
concept = "shell-and-paths"
competency = "Run commands, navigate paths, and edit files in a POSIX-like shell."

[[assumptions]]
concept = "host-guest-kernel-boundary"
competency = "Distinguish the host from the disposable guest and userspace from kernel space."

[[assumptions]]
concept = "c-preprocessor"
competency = "Read macro calls, compile-time definitions, conditional compilation, and #error."

[[assumptions]]
concept = "c-pointers-and-structs"
competency = "Work with pointers, NULL, structures, arrays, and function declarations."

[[assumptions]]
concept = "linux-process-basics"
competency = "Recognize processes, threads, PIDs, signals, and the current executing task."

[[assumptions]]
concept = "linux-identity-basics"
competency = "Distinguish users, groups, real and effective IDs, and user namespaces."

[[assumptions]]
concept = "ipv4-packet-basics"
competency = "Recognize an IPv4 header and distinguish ICMP, TCP, and UDP payloads."

[[assumptions]]
concept = "transport-endpoint-basics"
competency = "Recognize addresses, ports, stream sockets, and datagram sockets."

[[assumptions]]
concept = "dns-name-basics"
competency = "Recognize a DNS name as labels terminated by the root label."

[[assumptions]]
concept = "linux-file-permission-basics"
competency = "Understand paths, ownership, permission bits, and file descriptors."

