schema_version = 2
revision = "2026.10-operational-milestones"
default_module_artifact = "rklings.ko"
exercise_roots = ["curriculum"]

required_route = [
  # Block 1: Module core (L00-L03)
  "module-build-lifecycle",
  "precise-init-failure",
  "owned-kernel-state",
  "proc-publication",

  # Block 2: Control + execution (L04-L07, M00)
  "proc-read-contract",
  "bounded-control-switch",
  "timer-workqueue-scheduler",
  "event-driven-kernel-thread",
  "reversible-persistence",

  # Block 3: Identity + instrumentation (L08-L12, M01)
  "current-task-attribution",
  "linux-credential-model",
  "transactional-credential-replacement",
  "managed-kprobe",
  "return-aware-syscall-telemetry",
  "module-cloak",

  # Block 3b: Local covert control (M02)
  "local-covert-control",

  # Block 4: Views + hiding (L13-L15, M03)
  "cross-view-evidence",
  "packed-directory-filter",
  "bounded-line-filter",
  "dynamic-directory-filter",

  # Block 5: Network + shell (L16-L21, M04)
  "hostile-packet-lengths",
  "safe-skb-access",
  "netfilter-observer",
  "validated-packet-classification",
  "kernel-socket-ownership",
  "root-shell-bridge",
  "callback-shell",

  # Block 6: Crypto + auth (L22-L25, M05)
  "protection-property-selection",
  "sha256-verification",
  "authenticated-replay-safe-message",
  "authenticated-encryption",
  "authenticated-channel",

  # Block 7: Advanced hiding (L26, M06)
  "tcp-port-filter",
  "content-port-filter",

  # Final project
  "complete-rootkit",
]

