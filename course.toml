[[assumptions]]
concept = "c-programming"
competency = "Read and edit C functions, structs, pointers, arrays, control flow, and error-return paths, and interpret compiler diagnostics."

[[assumptions]]
concept = "unix-shell"
competency = "Run commands in a POSIX-like shell and use paths, quoting, redirection, pipelines, environment variables, and an editor."

[[assumptions]]
concept = "linux-processes-and-files"
competency = "Understand files, directories, permissions, processes, users and groups, PIDs, signals, file descriptors, and the distinction between userspace and kernel space."

[[assumptions]]
concept = "networking-fundamentals"
competency = "Recognize IPv4 addresses, TCP and UDP ports, client/server connections, ICMP echo traffic, DNS names, and network byte order."
