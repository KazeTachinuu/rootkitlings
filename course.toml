exercise_roots = ["exercises"]

required_route = [
  # Phase 1: Kernel foundation (L00-L04)
  "kernel-module",
  "load-cleanup",
  "module-state",
  "proc-status",
  "proc-control",

  # Phase 2: Escalation (L05-L07)
  "mkdir-command",
  "shell-root",
  "process-root",

  # Phase 3: Interception (L08-L09)
  "mkdir-hook",
  "command-routing",

  # M00: Persistence + Stealth
  "persistence-stealth",

  # Phase 4: Concealment (L10-L13)
  "hide-targets",
  "dirent-filter",
  "content-filter",
  "port-filter",

  # M01: Covert Local Control
  "local-control",

  # D00: Deployment
  "deploy",

  # Phase 5: The Split (L14-L16)
  "usermode-helper",
  "agent-qualification",
  "mtls-connect",
  "mkdir-bridge",

  # Phase 6: Remote Operations (L17-L19)
  "command-dispatch",
  "remote-shell",
  "file-transfer",

  # M02: Remote Control
  "remote-control",

  # Phase 7: Tradecraft (L20-L24)
  "fileless-module",
  "fileless-exec",
  "decoy-routing",
  "process-masquerade",
  "anti-forensics",

  # M03: Ghost
  "ghost",

  # P00: Complete Rootkit
  "complete-rootkit",
]

