schema_version = 2
id = "process-masquerade"
title = "Masquerade as a kernel thread with jitter and auto-hide"
stage = "tradecraft"
kind = "lesson"
vm_user = "student"
preload_module = true
tradecraft = ["evasion", "anti-forensics"]
difficulty = "standard"
prerequisites = ["decoy-routing"]
teaches = ["prctl-set-name", "process-masquerade", "callback-jitter", "auto-concealment"]
requires = []

[workspace]
mode = "project"
files = ["main.go", "go.mod"]
editable = ["main.go"]
build = "."
baseline = "starter"
source = "exercises/L23-process-masquerade/starter"

[resources]
readme = "exercises/L23-process-masquerade/README.md"
host_check = ""
solution = "exercises/L23-process-masquerade/solution"

[verification]
timeout_seconds = 120
tools = ["mtls-fixture"]

[[verification.cases]]
id = "comm-name"
label = "Process comm is [kworker/0:1]"
expect_build = "pass"
check = "exercises/L23-process-masquerade/checks/comm-name"

[[verification.cases]]
id = "not-dumpable"
label = "Process is not dumpable and core dumps disabled"
expect_build = "pass"
check = "exercises/L23-process-masquerade/checks/not-dumpable"

[[verification.cases]]
id = "auto-hide"
label = "Agent auto-hides PID and port on connect"
expect_build = "pass"
check = "exercises/L23-process-masquerade/checks/auto-hide"

[[verification.cases]]
id = "jitter"
label = "Callback interval varies between connections"
expect_build = "pass"
check = "exercises/L23-process-masquerade/checks/jitter"
