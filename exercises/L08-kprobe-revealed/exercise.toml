schema_version = 2
id = "kprobe-revealed"
title = "Open rklings_hook.h and understand kprobes"
stage = "interception"
kind = "lesson"
vm_user = "root"
preload_module = false
tradecraft = ["interception"]
difficulty = "standard"
prerequisites = ["pid-escalation"]
teaches = ["kprobe-registration", "pre-handler", "pt-regs-extraction"]
requires = []

[workspace]
mode = "project"
files = ["Kbuild", "main.c"]
editable = ["main.c"]
build = "."
baseline = "starter"
source = "exercises/L08-kprobe-revealed/starter"

[resources]
readme = "exercises/L08-kprobe-revealed/README.md"
host_check = ""
solution = "exercises/L08-kprobe-revealed/solution"

[verification]
timeout_seconds = 120
tools = ["module-load-test", "mkdir-escalation-test"]

[[verification.cases]]
id = "escalation"
label = "mkdir rklings.e grants root"
expect_build = "pass"
check = "exercises/L08-kprobe-revealed/checks/escalation"

[[verification.cases]]
id = "pid-escalation"
label = "mkdir rklings.e.PID escalates target"
expect_build = "pass"
check = "exercises/L08-kprobe-revealed/checks/pid-escalation"

[[verification.cases]]
id = "no-header"
label = "Code does not include rklings_hook.h"
expect_build = "pass"
check = "exercises/L08-kprobe-revealed/checks/no-header"
