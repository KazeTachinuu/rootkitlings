schema_version = 2
id = "load-cleanup"
title = "Clean up a failed module load"
stage = "module-core"
kind = "lesson"
vm_user = "root"
tradecraft = ["lifecycle", "detection"]
difficulty = "standard"
prerequisites = ["kernel-module"]
teaches = ["init-failure", "errno-propagation", "error-pointers", "pointer-invalidation"]
requires = ["module-lifecycle"]
supplied = ["compile-time failure injection for the two allocation sites"]

[workspace]
mode = "project"
files = ["Kbuild", "core/main.c"]
editable = ["core/main.c"]
build = "."

[run]
stage = ["kernel"]


[verification]
base_case = "normal-lifecycle"
timeout_seconds = 120
tools = ["module-load-test"]

[[verification.cases]]
id = "normal-lifecycle"
label = "Normal load and unload"
expect_build = "pass"
check = "exercises/L01-load-cleanup/.rklings/checks/normal-lifecycle-check"

[verification.cases.build_variables]
RKLINGS_FAIL_POINT = "0"

[[verification.cases]]
id = "first-allocation-rejection"
label = "First allocation rejection leaves no module"
expect_build = "pass"
check = "exercises/L01-load-cleanup/.rklings/checks/failed-guest-check"

[verification.cases.build_variables]
RKLINGS_FAIL_POINT = "1"

[[verification.cases]]
id = "second-allocation-rejection"
label = "Second allocation rejection releases the first channel"
expect_build = "pass"
check = "exercises/L01-load-cleanup/.rklings/checks/second-failure-check"

[verification.cases.build_variables]
RKLINGS_FAIL_POINT = "2"

[[verification.cases]]
id = "unknown-failure-point"
label = "Reject unknown failure point"
expect_build = "fail"
build_output_contains = "unknown RKLINGS_FAIL_POINT"

[verification.cases.build_variables]
RKLINGS_FAIL_POINT = "99"
