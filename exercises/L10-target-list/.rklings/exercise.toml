schema_version = 2
id = "target-list"
title = "Build a thread-safe target list"
stage = "concealment"
kind = "lesson"
vm_user = "student"
tradecraft = ["concealment"]
difficulty = "standard"
prerequisites = ["owned-kernel-state"]
teaches = ["spinlock", "irq-safe-locking", "fixed-array-storage"]
requires = []

[workspace]
mode = "project"
files = ["Kbuild", "main.c"]
editable = ["main.c"]
build = "."

[run]
stage = ["kernel"]
load = ["kernel"]


[verification]
load_kernel = true
timeout_seconds = 120
tools = ["module-load-test"]

[[verification.cases]]
id = "add-and-read"
label = "Add targets and read them back"
expect_build = "pass"
check = "exercises/L10-target-list/.rklings/checks/add-and-read"

[[verification.cases]]
id = "remove-target"
label = "Remove a target by exact value"
expect_build = "pass"
check = "exercises/L10-target-list/.rklings/checks/remove-target"

[[verification.cases]]
id = "match-target"
label = "Match returns true for listed names"
expect_build = "pass"
check = "exercises/L10-target-list/.rklings/checks/match-target"

[[verification.cases]]
id = "overflow-rejected"
label = "Adding beyond RK_TARGET_MAX is rejected"
expect_build = "pass"
check = "exercises/L10-target-list/.rklings/checks/overflow-rejected"
