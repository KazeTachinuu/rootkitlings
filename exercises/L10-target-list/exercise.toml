schema_version = 2
id = "target-list"
title = "Build a thread-safe target list"
stage = "concealment"
kind = "lesson"
vm_user = "student"
preload_module = true
tradecraft = ["concealment"]
difficulty = "standard"
prerequisites = ["owned-kernel-state"]
teaches = ["spinlock", "irq-safe-locking", "fixed-array-storage"]
requires = []

[workspace]
mode = "project"
files = ["Kbuild", "main.c"]
editable = ["main.c"]
build = "."
baseline = "starter"
source = "exercises/L10-target-list/starter"

[resources]
readme = "exercises/L10-target-list/README.md"
host_check = ""
solution = "exercises/L10-target-list/solution"

[verification]
timeout_seconds = 120
tools = ["module-load-test"]

[[verification.cases]]
id = "add-and-read"
label = "Add targets and read them back"
expect_build = "pass"
check = "exercises/L10-target-list/checks/add-and-read"

[[verification.cases]]
id = "remove-target"
label = "Remove a target by index"
expect_build = "pass"
check = "exercises/L10-target-list/checks/remove-target"

[[verification.cases]]
id = "match-target"
label = "Match returns true for listed names"
expect_build = "pass"
check = "exercises/L10-target-list/checks/match-target"

[[verification.cases]]
id = "overflow-rejected"
label = "Adding beyond RK_TARGET_MAX is rejected"
expect_build = "pass"
check = "exercises/L10-target-list/checks/overflow-rejected"
