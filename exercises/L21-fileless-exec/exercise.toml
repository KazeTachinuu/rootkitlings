schema_version = 2
id = "fileless-exec"
title = "Execute a binary without writing it to disk"
stage = "tradecraft"
kind = "lesson"
vm_user = "student"
preload_module = false
tradecraft = ["fileless", "anti-forensics"]
difficulty = "standard"
prerequisites = ["fileless-module"]
teaches = ["memfd-exec", "proc-self-fd", "fileless-execution"]
requires = []

[workspace]
mode = "project"
files = ["main.go", "go.mod"]
editable = ["main.go"]
build = "."
baseline = "starter"
source = "exercises/L21-fileless-exec/starter"

[resources]
readme = "exercises/L21-fileless-exec/README.md"
host_check = ""
solution = "exercises/L21-fileless-exec/solution"

[verification]
timeout_seconds = 120
tools = []

[[verification.cases]]
id = "agent-running"
label = "Agent process is running"
expect_build = "pass"
check = "exercises/L21-fileless-exec/checks/agent-running"

[[verification.cases]]
id = "no-binary-on-disk"
label = "No agent binary exists on disk"
expect_build = "pass"
check = "exercises/L21-fileless-exec/checks/no-binary-on-disk"

[[verification.cases]]
id = "exe-deleted"
label = "/proc/pid/exe shows (deleted)"
expect_build = "pass"
check = "exercises/L21-fileless-exec/checks/exe-deleted"
