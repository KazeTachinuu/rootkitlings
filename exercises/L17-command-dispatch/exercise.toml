schema_version = 2
id = "command-dispatch"
title = "Command dispatch over mTLS"
stage = "remote"
kind = "lesson"
vm_user = "root"
preload_module = true
tradecraft = ["c2", "dispatch"]
difficulty = "standard"
prerequisites = ["mkdir-bridge"]
teaches = ["bufio-scanner", "handler-map", "text-protocol"]
requires = []

[workspace]
mode = "project"
files = ["main.go", "go.mod"]
editable = ["main.go"]
build = "."
baseline = "starter"
source = "exercises/L17-command-dispatch/starter"

[resources]
readme = "exercises/L17-command-dispatch/README.md"
host_check = ""
solution = "exercises/L17-command-dispatch/solution"

[verification]
timeout_seconds = 120
tools = ["mtls-agent-test"]

[[verification.cases]]
id = "ping"
label = "Server sends PING, agent responds PONG"
expect_build = "pass"
check = "exercises/L17-command-dispatch/checks/ping"

[[verification.cases]]
id = "status"
label = "Server sends STATUS, agent responds with state"
expect_build = "pass"
check = "exercises/L17-command-dispatch/checks/status"

[[verification.cases]]
id = "hide-file"
label = "Server sends HIDE FILE x, file hidden from ls"
expect_build = "pass"
check = "exercises/L17-command-dispatch/checks/hide-file"

[[verification.cases]]
id = "escalate"
label = "Server sends ESCALATE, agent gains root"
expect_build = "pass"
check = "exercises/L17-command-dispatch/checks/escalate"
