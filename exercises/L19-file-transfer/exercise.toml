schema_version = 2
id = "file-transfer"
title = "File transfer over mTLS"
stage = "remote"
kind = "lesson"
vm_user = "root"
preload_module = true
tradecraft = ["c2", "exfiltration", "staging"]
difficulty = "standard"
prerequisites = ["remote-shell"]
teaches = ["size-then-bytes", "io-limitreader", "file-io"]
requires = []

[workspace]
mode = "project"
files = ["main.go", "go.mod"]
editable = ["main.go"]
build = "."
baseline = "starter"
source = "exercises/L19-file-transfer/starter"

[resources]
readme = "exercises/L19-file-transfer/README.md"
host_check = ""
solution = "exercises/L19-file-transfer/solution"

[verification]
timeout_seconds = 120
tools = ["mtls-agent-test"]

[[verification.cases]]
id = "download"
label = "DOWNLOAD /etc/hostname returns file contents"
expect_build = "pass"
check = "exercises/L19-file-transfer/checks/download"

[[verification.cases]]
id = "upload"
label = "UPLOAD writes file with correct contents"
expect_build = "pass"
check = "exercises/L19-file-transfer/checks/upload"

[[verification.cases]]
id = "download-size"
label = "DOWNLOAD sends correct size header"
expect_build = "pass"
check = "exercises/L19-file-transfer/checks/download-size"

[[verification.cases]]
id = "dispatch-intact"
label = "PING and EXEC still work alongside file transfer"
expect_build = "pass"
check = "exercises/L19-file-transfer/checks/dispatch-intact"
