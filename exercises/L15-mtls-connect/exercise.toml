schema_version = 2
id = "mtls-connect"
title = "Go agent with mTLS callback"
stage = "split"
kind = "lesson"
vm_user = "root"
preload_module = false
tradecraft = ["communication", "encryption"]
difficulty = "standard"
prerequisites = ["usermode-helper"]
teaches = ["mtls-handshake", "go-embed", "tls-config"]
requires = []

[workspace]
mode = "project"
files = ["go.mod", "main.go"]
editable = ["main.go"]
build = "."
baseline = "starter"
source = "exercises/L15-mtls-connect/starter"

[resources]
readme = "exercises/L15-mtls-connect/README.md"
host_check = "l15"
solution = "exercises/L15-mtls-connect/solution"

[verification]
timeout_seconds = 120
tools = ["mtls-server"]

[[verification.cases]]
id = "tls-connect"
label = "Agent connects to server with TLS 1.3"
expect_build = "pass"
check = "exercises/L15-mtls-connect/checks/tls-connect"

[[verification.cases]]
id = "client-cert"
label = "Server receives valid client certificate"
expect_build = "pass"
check = "exercises/L15-mtls-connect/checks/client-cert"
