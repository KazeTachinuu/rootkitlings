schema_version = 2
id = "mkdir-escalation"
title = "Become root with a single mkdir"
stage = "escalation"
kind = "lesson"
vm_user = "student"
tradecraft = ["privilege"]
difficulty = "standard"
prerequisites = ["mkdir-reaction"]
teaches = ["credential-replacement", "privilege-escalation"]
requires = []

[workspace]
mode = "project"
files = ["Kbuild", "main.c", "rklings_hook.h"]
editable = ["main.c"]
build = "."

[run]
stage = ["kernel"]
load = ["kernel"]


[verification]
load_kernel = true
timeout_seconds = 120
tools = ["module-load-test", "mkdir-escalation-test"]

[[verification.cases]]
id = "escalation"
label = "mkdir rklings.e grants root credentials"
expect_build = "pass"
check = "exercises/L06-mkdir-escalation/.rklings/checks/escalation"

[[verification.cases]]
id = "non-matching"
label = "Non-matching mkdir does not escalate"
expect_build = "pass"
check = "exercises/L06-mkdir-escalation/.rklings/checks/non-matching"
