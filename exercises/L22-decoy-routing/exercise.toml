schema_version = 2
id = "decoy-routing"
title = "Route agents to C2 and browsers to a decoy site"
stage = "tradecraft"
kind = "lesson"
vm_user = "root"
preload_module = false
tradecraft = ["evasion", "network"]
difficulty = "standard"
prerequisites = ["fileless-exec"]
teaches = ["tls-client-auth", "decoy-routing", "certificate-verification"]
requires = []

[workspace]
mode = "project"
files = ["main.go", "go.mod"]
editable = ["main.go"]
build = "."
baseline = "starter"
source = "exercises/L22-decoy-routing/starter"

[resources]
readme = "exercises/L22-decoy-routing/README.md"
host_check = ""
solution = "exercises/L22-decoy-routing/solution"

[verification]
timeout_seconds = 120
tools = ["mtls-fixture"]

[[verification.cases]]
id = "decoy-no-cert"
label = "Client without cert receives decoy page"
expect_build = "pass"
check = "exercises/L22-decoy-routing/checks/decoy-no-cert"

[[verification.cases]]
id = "decoy-wrong-cert"
label = "Client with wrong cert receives decoy page"
expect_build = "pass"
check = "exercises/L22-decoy-routing/checks/decoy-wrong-cert"

[[verification.cases]]
id = "c2-right-cert"
label = "Client with rklings CA cert reaches C2"
expect_build = "pass"
check = "exercises/L22-decoy-routing/checks/c2-right-cert"
