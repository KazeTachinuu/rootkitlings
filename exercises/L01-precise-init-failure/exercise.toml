schema_version = 2
id = "precise-init-failure"
title = "Abort a bad start cleanly"
stage = "module-core"
kind = "lesson"
vm_user = "root"
preload_module = false
tradecraft = ["lifecycle", "detection"]
difficulty = "standard"
prerequisites = ["module-build-lifecycle"]
teaches = ["init-failure", "errno-propagation", "build-time-failure-injection"]
requires = ["module-lifecycle", "c-preprocessor"]

[workspace]
mode = "project"
files = ["Kbuild", "core/main.c"]
editable = ["core/main.c"]
build = "."
baseline = "starter"
source = "exercises/L01-precise-init-failure/starter"

[resources]
readme = "exercises/L01-precise-init-failure/README.md"
host_check = "exercises/L00-module-build-lifecycle/checks/host-check"
solution = "exercises/L01-precise-init-failure/solution"

[verification]
timeout_seconds = 120
tools = ["module-load-test"]

[[verification.cases]]
id = "normal-lifecycle"
label = "Normal load and unload"
expect_build = "pass"
check = "exercises/L00-module-build-lifecycle/checks/module-lifecycle-check"

[verification.cases.build_variables]
RKLINGS_FAIL_POINT = "0"

[[verification.cases]]
id = "precise-rejection"
label = "Injected initialization rejection"
expect_build = "pass"
check = "exercises/L01-precise-init-failure/checks/failed-guest-check"

[verification.cases.build_variables]
RKLINGS_FAIL_POINT = "1"

[[verification.cases]]
id = "unknown-failure-point"
label = "Reject unknown failure point"
expect_build = "fail"
build_output_contains = "unknown RKLINGS_FAIL_POINT"

[verification.cases.build_variables]
RKLINGS_FAIL_POINT = "99"
