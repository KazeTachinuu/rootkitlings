schema_version = 2
id = "module-build-lifecycle"
title = "Build and load a kernel module"
stage = "module-core"
kind = "lesson"
vm_user = "root"
tradecraft = ["lifecycle", "detection"]
difficulty = "standard"
prerequisites = []
teaches = ["module-lifecycle", "module-build", "module-inspection"]
requires = ["c-functions-and-errors", "shell-and-paths", "host-guest-kernel-boundary"]

[workspace]
mode = "project"
files = ["Kbuild", "core/main.c"]
editable = ["Kbuild", "core/main.c"]
build = "."

[run]
stage = ["kernel"]


[verification]
base_case = "normal-lifecycle"
timeout_seconds = 120
tools = []

[[verification.cases]]
id = "normal-lifecycle"
label = "Normal load and unload"
expect_build = "pass"
check = "exercises/L00-module-build-lifecycle/.rklings/checks/module-lifecycle-check"

[verification.cases.build_variables]
RKLINGS_FAIL_POINT = "0"
