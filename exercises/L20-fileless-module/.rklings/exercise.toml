schema_version = 2
id = "fileless-module"
title = "Load a kernel module without touching disk"
stage = "tradecraft"
kind = "lesson"
vm_user = "root"
tradecraft = ["fileless", "anti-forensics"]
difficulty = "standard"
prerequisites = ["remote-control"]
teaches = ["memfd-create", "finit-module", "fileless-loading"]
requires = ["go-embed"]

[workspace]
mode = "project"
files = ["main.go", "go.mod", "go.sum"]
editable = ["main.go"]
build = "."

[build]
embed_module_from = "local-control"

[run]
stage = ["agent"]
agent = "once"


[verification]
timeout_seconds = 120
tools = []
runtime = "once"

[[verification.cases]]
id = "module-loaded"
label = "rklings module is loaded in the kernel"
expect_build = "pass"
check = "exercises/L20-fileless-module/.rklings/checks/module-loaded"

[[verification.cases]]
id = "no-file-on-disk"
label = "No .ko file exists anywhere on disk"
expect_build = "pass"
check = "exercises/L20-fileless-module/.rklings/checks/no-file-on-disk"

[[verification.cases]]
id = "memfd-used"
label = "Module was loaded via memfd (no file path in /proc)"
expect_build = "pass"
check = "exercises/L20-fileless-module/.rklings/checks/memfd-used"
