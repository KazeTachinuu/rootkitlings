schema_version = 2
id = "remote-shell"
title = "Remote shell execution over mTLS"
stage = "remote"
kind = "lesson"
vm_user = "root"
tradecraft = ["c2", "execution"]
difficulty = "easy"
prerequisites = ["command-dispatch"]
teaches = ["exec-command", "combined-output", "shell-wrapping"]
requires = []

[workspace]
mode = "project"
files = ["main.go", "go.mod"]
editable = ["main.go"]
build = "."

[build]
module_from = "local-control"


[run]
stage = ["kernel", "agent"]
load = ["kernel"]
agent = "background"

[serve]
kind = "lab"
commands = ["PING", "STATUS", "SHELL"]

[verification]
load_kernel = true
timeout_seconds = 120
tools = []
runtime = "background"
harness = true

[[verification.cases]]
id = "exec-id"
label = "SHELL id returns uid=0"
expect_build = "pass"
check = "exercises/L18-remote-shell/.rklings/checks/exec-id"

[[verification.cases]]
id = "exec-multiword"
label = "SHELL handles pipes and redirects"
expect_build = "pass"
check = "exercises/L18-remote-shell/.rklings/checks/exec-multiword"

[[verification.cases]]
id = "exec-error"
label = "SHELL reports nonexistent command error"
expect_build = "pass"
check = "exercises/L18-remote-shell/.rklings/checks/exec-error"

[[verification.cases]]
id = "dispatch-intact"
label = "PING still works alongside SHELL"
expect_build = "pass"
check = "exercises/L18-remote-shell/.rklings/checks/dispatch-intact"
