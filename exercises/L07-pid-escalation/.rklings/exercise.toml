schema_version = 2
id = "pid-escalation"
title = "Escalate another process by PID"
stage = "escalation"
kind = "lesson"
vm_user = "student"
tradecraft = ["privilege", "control"]
difficulty = "standard"
prerequisites = ["mkdir-escalation"]
teaches = ["task-lookup", "credential-lifetime", "pid-targeting"]
requires = []

[workspace]
mode = "project"
files = ["Kbuild", "main.c", "rklings_hook.h"]
editable = ["main.c"]
build = "."

[run]
stage = ["kernel"]
load = ["kernel"]


[verification]
load_kernel = true
timeout_seconds = 120
tools = ["module-load-test", "mkdir-escalation-test"]

[[verification.cases]]
id = "self-escalation"
label = "mkdir rklings.e grants root to the calling shell"
expect_build = "pass"
check = "exercises/L07-pid-escalation/.rklings/checks/self-escalation"

[[verification.cases]]
id = "pid-targeting"
label = "mkdir rklings.e.PID immediately elevates the target"
expect_build = "pass"
check = "exercises/L07-pid-escalation/.rklings/checks/pid-targeting"

[[verification.cases]]
id = "immediate-delivery"
label = "Target PID receives real root credentials immediately"
expect_build = "pass"
check = "exercises/L07-pid-escalation/.rklings/checks/immediate-delivery"
