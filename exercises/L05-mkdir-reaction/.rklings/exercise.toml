schema_version = 2
id = "mkdir-reaction"
title = "React to a mkdir from the kernel"
stage = "escalation"
kind = "lesson"
vm_user = "root"
tradecraft = ["interception"]
difficulty = "standard"
prerequisites = ["owned-kernel-state"]
teaches = ["mkdir-interception", "reactive-hook"]
requires = []

[workspace]
mode = "project"
files = ["Kbuild", "main.c", "rklings_hook.h"]
editable = ["main.c"]
build = "."

[run]
stage = ["kernel"]


[verification]
timeout_seconds = 120
tools = ["module-load-test"]

[[verification.cases]]
id = "intercept-matching"
label = "mkdir rklings.hello prints intercepted message"
expect_build = "pass"
check = "exercises/L05-mkdir-reaction/.rklings/checks/intercept-matching"

[[verification.cases]]
id = "ignore-non-matching"
label = "Non-matching mkdir is ignored"
expect_build = "pass"
check = "exercises/L05-mkdir-reaction/.rklings/checks/ignore-non-matching"
