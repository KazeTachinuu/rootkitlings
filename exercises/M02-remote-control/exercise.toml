schema_version = 2
id = "remote-control"
title = "Full C2 with operator TUI and mTLS agent"
stage = "remote"
kind = "milestone"
vm_user = "root"
preload_module = false
tradecraft = ["control", "network", "crypto"]
difficulty = "advanced"
prerequisites = ["file-transfer"]
teaches = ["c2-architecture", "operator-tui", "full-remote-dispatch"]
requires = []

[workspace]
mode = "project"
files = [
    "go.mod",
    "go.sum",
    "cmd/agent/main.go",
    "cmd/server/main.go",
    "cmd/server/tui.go",
    "cmd/server/web.go",
]
editable = [
    "cmd/agent/main.go",
    "cmd/server/main.go",
    "cmd/server/tui.go",
    "cmd/server/web.go",
]
build = "."
baseline = "starter"
source = "exercises/M02-remote-control/starter"

[resources]
readme = "exercises/M02-remote-control/README.md"
host_check = ""
solution = "exercises/M02-remote-control/solution"

[verification]
timeout_seconds = 180
tools = ["module-load-test", "mtls-agent-fixture"]

[[verification.cases]]
id = "agent-connects"
label = "Agent establishes mTLS connection to server"
expect_build = "pass"
check = "exercises/M02-remote-control/checks/agent-connects"

[[verification.cases]]
id = "command-dispatch"
label = "Operator commands reach agent and return results"
expect_build = "pass"
check = "exercises/M02-remote-control/checks/command-dispatch"

[[verification.cases]]
id = "shell-exec"
label = "Remote shell execution works"
expect_build = "pass"
check = "exercises/M02-remote-control/checks/shell-exec"

[[verification.cases]]
id = "file-transfer"
label = "File download works over mTLS"
expect_build = "pass"
check = "exercises/M02-remote-control/checks/file-transfer"

[[verification.cases]]
id = "tls-only"
label = "tcpdump sees only TLS traffic on port 443"
expect_build = "pass"
check = "exercises/M02-remote-control/checks/tls-only"

[[verification.cases]]
id = "mkdir-bridge"
label = "Server HIDE commands trigger mkdir in VM"
expect_build = "pass"
check = "exercises/M02-remote-control/checks/mkdir-bridge"
