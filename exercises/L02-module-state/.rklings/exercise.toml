schema_version = 2
id = "module-state"
title = "Remember module state"
stage = "module-core"
kind = "lesson"
vm_user = "root"
tradecraft = ["lifecycle", "detection"]
difficulty = "standard"
prerequisites = ["load-cleanup"]
teaches = ["multi-file-modules", "component-ownership", "kernel-allocation", "c-pointers-and-structs"]
requires = ["module-build", "init-failure", "errno-propagation", "error-pointers"]
supplied = [
  "state operation signatures and compiler annotation",
  "read-only active module parameter",
  "allocation helper with compile-time failure injection",
]

[workspace]
mode = "project"
files = ["Kbuild", "core/main.c", "core/state.c", "include/rootkit.h"]
editable = ["core/main.c", "core/state.c"]
build = "."

[run]
stage = ["kernel"]


[verification]
base_case = "normal-lifecycle"
timeout_seconds = 120
tools = ["module-load-test"]

[[verification.cases]]
id = "normal-lifecycle"
label = "Normal state lifetime"
expect_build = "pass"
check = "exercises/L02-module-state/.rklings/checks/state-lifecycle-check"

[verification.cases.build_variables]
RKLINGS_FAIL_POINT = "0"

[[verification.cases]]
id = "allocation-rejection"
label = "State allocation rejection"
expect_build = "pass"
check = "exercises/L02-module-state/.rklings/checks/failure-enomem-check"

[verification.cases.build_variables]
RKLINGS_FAIL_POINT = "1"

[[verification.cases]]
id = "unknown-failure-point"
label = "Reject unknown failure point"
expect_build = "fail"
build_output_contains = "unknown RKLINGS_FAIL_POINT"

[verification.cases.build_variables]
RKLINGS_FAIL_POINT = "99"
