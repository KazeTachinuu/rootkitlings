schema_version = 2
id = "full-operations"
title = "Complete remote management with auto-OPSEC"
stage = "operations"
kind = "milestone"
tradecraft = ["control", "network", "crypto", "concealment"]
difficulty = "advanced"
prerequisites = ["auto-opsec"]
teaches = ["full-operations-integration"]
requires = []

[workspace]
mode = "project"
files = [
    "Kbuild",
    "include/rootkit.h",
    "core/init.c",
    "core/target.c",
    "core/filter.c",
    "core/opsec.c",
    "crypto/envelope.c",
    "network/protocol.c",
    "network/agent.c",
    "execution/dispatch.c",
    "execution/commands.c",
    "execution/shell.c",
]
editable = [
    "include/rootkit.h",
    "core/init.c",
    "core/target.c",
    "core/filter.c",
    "core/opsec.c",
    "crypto/envelope.c",
    "network/protocol.c",
    "network/agent.c",
    "execution/dispatch.c",
    "execution/commands.c",
    "execution/shell.c",
]
build = "."
baseline = "starter"
source = "curriculum/M05-full-operations/starter"

[resources]
readme = "curriculum/M05-full-operations/README.md"
host_check = ""
hint = "curriculum/M05-full-operations/hint"
solution = "curriculum/M05-full-operations/solution"

[verification]
timeout_seconds = 120
tools = ["module-load-test"]

[[verification.cases]]
id = "full-operations"
label = "All commands work remotely with auto-OPSEC"
expect_build = "pass"
check = "curriculum/M05-full-operations/checks/full-operations"
network = true
