schema_version = 2
id = "kprobe-revealed"
title = "Open rklings_hook.h and understand kprobes"
stage = "interception"
kind = "lesson"
tradecraft = ["interception"]
difficulty = "standard"
prerequisites = ["pid-escalation"]
teaches = ["kprobe-registration", "pre-handler", "pt-regs-extraction"]
requires = []

[workspace]
mode = "project"
files = ["Kbuild", "main.c"]
build = "."
baseline = "starter"
source = "curriculum/L08-kprobe-revealed/starter"

[resources]
readme = "curriculum/L08-kprobe-revealed/README.md"
host_check = ""
hint = "curriculum/L08-kprobe-revealed/hint"
solution = "curriculum/L08-kprobe-revealed/solution"

[verification]
timeout_seconds = 120
tools = ["module-load-test"]

[[verification.cases]]
id = "escalation"
label = "mkdir rklings.e grants root"
expect_build = "pass"
check = ""

[[verification.cases]]
id = "pid-escalation"
label = "mkdir rklings.e.PID escalates target"
expect_build = "pass"
check = ""

[[verification.cases]]
id = "no-header"
label = "Code does not include rklings_hook.h"
expect_build = "pass"
check = ""
