schema_version = 2
id = "auto-opsec"
title = "Auto-hide the agent's own traces"
stage = "operations"
kind = "lesson"
tradecraft = ["concealment"]
difficulty = "standard"
prerequisites = ["full-protocol"]
teaches = ["auto-targeting", "opsec-automation"]
requires = []

[workspace]
mode = "project"
files = [
    "Kbuild",
    "include/rootkit.h",
    "core/init.c",
    "core/target.c",
    "core/filter.c",
    "core/opsec.c",
    "crypto/envelope.c",
    "network/protocol.c",
    "network/agent.c",
    "execution/dispatch.c",
    "execution/commands.c",
    "execution/shell.c",
]
editable = ["core/opsec.c", "network/agent.c", "include/rootkit.h"]
build = "."
baseline = "starter"
source = "curriculum/L26-auto-opsec/starter"

[resources]
readme = "curriculum/L26-auto-opsec/README.md"
host_check = ""
hint = "curriculum/L26-auto-opsec/hint"
solution = "curriculum/L26-auto-opsec/solution"

[verification]
timeout_seconds = 120
tools = ["module-load-test"]

[[verification.cases]]
id = "auto-opsec"
label = "Agent auto-hides PID and port on connect"
expect_build = "pass"
check = "curriculum/L26-auto-opsec/checks/auto-opsec"
network = true
