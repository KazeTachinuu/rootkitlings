schema_version = 2
id = "remote-resident-agent"
title = "Call home and request loading at boot"
stage = "network-state"
kind = "milestone"
status = "required"
tradecraft = ["control", "networking", "persistence", "lifecycle"]
difficulty = "advanced"
prerequisites = ["concealment-evidence-map", "tcp-framing-cancellation", "guarded-file-transaction"]
teaches = ["resident-client-retry", "connect-back-agent", "remote-agent-integration", "boot-load-persistence"]
requires = ["machine-readable-evidence-map", "tcp-length-framing", "blocked-io-cancellation", "compare-before-rollback"]

[workspace]
mode = "cumulative"
files = ["Kbuild", "core/main.c", "core/state.c", "include/rootkit.h", "interface/proc.c", "execution/worker.c", "execution/scheduler.c", "control/authorization.c", "privilege/credentials.c", "instrumentation/events.c", "instrumentation/return_probe.c", "include/dirent_filter.h", "instrumentation/dirent_filter.c", "instrumentation/getdents_probe.c", "interface/evidence.c", "include/agent.h", "include/agent_status.h", "include/framing.h", "include/platform.h", "include/protocol.h", "include/transaction.h", "interface/agent_status.c", "network/agent.c", "network/framing.c", "network/protocol.c", "persistence/platform.c", "persistence/transaction.c"]
editable = ["Kbuild", "core/main.c", "network/agent.c"]
build = "."
baseline = "previous-milestone"
additions = "curriculum/M03-remote-resident-agent/starter"

[resources]
readme = "curriculum/M03-remote-resident-agent/README.md"
check = "curriculum/M03-remote-resident-agent/checks/success-check"
host_check = "curriculum/M03-remote-resident-agent/checks/host-check"
hint = "curriculum/M03-remote-resident-agent/hint"
solution = "curriculum/M03-remote-resident-agent/solution"

[verification]
timeout_seconds = 360
capabilities = []
tools = ["agent-fixture", "module-load-params", "getdents64-test", "event-stream-test", "status-field-test", "proc-write-test", "proc-read-test", "credential-trigger-test", "rmdir-telemetry-test", "run-as"]
cleanup_required = true

[[verification.cases]]
id = "remote-agent"
label = "Remote resident agent"
expect_build = "pass"
check = "curriculum/M03-remote-resident-agent/checks/success-check"
build_output_contains = ""
[verification.cases.build_variables]
ROOTKITLINGS_FAIL_POINT = "0"

[[verification.cases]]
id = "transaction-boundaries"
label = "Boot-request transaction boundaries"
expect_build = "pass"
check = "curriculum/M03-remote-resident-agent/checks/transaction-boundary-check"
