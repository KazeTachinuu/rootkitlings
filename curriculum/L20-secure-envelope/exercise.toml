schema_version = 2
id = "secure-envelope"
title = "Build the secure envelope with replay protection"
stage = "crypto"
kind = "lesson"
tradecraft = ["crypto"]
difficulty = "standard"
prerequisites = ["aead-encrypt"]
teaches = ["nonce-construction", "replay-protection", "protocol-composition"]
requires = []

[workspace]
mode = "project"
files = ["Kbuild", "main.c"]
editable = ["main.c"]
build = "."
baseline = "starter"
source = "curriculum/L20-secure-envelope/starter"

[resources]
readme = "curriculum/L20-secure-envelope/README.md"
host_check = ""
hint = "curriculum/L20-secure-envelope/hint"
solution = "curriculum/L20-secure-envelope/solution"

[verification]
timeout_seconds = 120
tools = ["module-load-test"]

[[verification.cases]]
id = "envelope-seal-open"
label = "Envelope seal, open, and replay rejection"
expect_build = "pass"
check = "curriculum/L20-secure-envelope/checks/envelope-seal-open"
