schema_version = 2
id = "complete-rootkit"
title = "Assemble and verify the complete rootkit"
stage = "project"
kind = "final-project"
tradecraft = ["control", "network", "crypto", "concealment", "persistence", "privilege"]
difficulty = "advanced"
prerequisites = ["full-operations"]
teaches = ["full-system-integration", "verification-methodology"]
requires = []

[workspace]
mode = "project"
files = [
    "Kbuild",
    "include/rootkit.h",
    "core/init.c",
    "core/target.c",
    "core/filter.c",
    "core/opsec.c",
    "crypto/envelope.c",
    "network/protocol.c",
    "network/agent.c",
    "execution/dispatch.c",
    "execution/commands.c",
    "execution/shell.c",
]
editable = [
    "include/rootkit.h",
    "core/init.c",
    "core/target.c",
    "core/filter.c",
    "core/opsec.c",
    "crypto/envelope.c",
    "network/protocol.c",
    "network/agent.c",
    "execution/dispatch.c",
    "execution/commands.c",
    "execution/shell.c",
]
build = "."
baseline = "starter"
source = "curriculum/P00-complete-rootkit/starter"

[resources]
readme = "curriculum/P00-complete-rootkit/README.md"
host_check = ""
hint = "curriculum/P00-complete-rootkit/hint"
solution = "curriculum/P00-complete-rootkit/solution"

[verification]
timeout_seconds = 180
tools = ["module-load-test", "secure-agent-fixture"]

[[verification.cases]]
id = "complete-rootkit"
label = "Complete rootkit loads, operates, and unloads cleanly"
expect_build = "pass"
check = "curriculum/P00-complete-rootkit/checks/complete-rootkit"
