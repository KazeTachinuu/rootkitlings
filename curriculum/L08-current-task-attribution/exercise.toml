schema_version = 2
id = "current-task-attribution"
title = "Attribute a proc read to the executing task"
stage = "identity-observation"
kind = "lesson"
status = "required"
tradecraft = ["instrumentation", "detection"]
difficulty = "standard"
prerequisites = ["proc-read-contract"]
teaches = ["current-task", "task-attribution"]
requires = ["proc-read", "linux-process-basics"]

[workspace]
mode = "cumulative"
files = ["Kbuild", "core/main.c", "core/state.c", "include/rootkit.h", "interface/proc.c"]
editable = ["interface/proc.c"]
build = "."
baseline = "scaffold"
source = "curriculum/L08-current-task-attribution/starter"
parent = "proc-read-contract"

[resources]
readme = "curriculum/L08-current-task-attribution/README.md"
check = "curriculum/L08-current-task-attribution/checks/success-check"
host_check = "curriculum/L08-current-task-attribution/checks/host-check"
hint = "curriculum/L08-current-task-attribution/hint"
solution = "curriculum/L08-current-task-attribution/solution"

[verification]
timeout_seconds = 180
capabilities = []
tools = ["module-load-test", "task-attribution-test"]
cleanup_required = true

[[verification.cases]]
id = "normal-attribution"
label = "Current-task attribution"
expect_build = "pass"
check = "curriculum/L08-current-task-attribution/checks/success-check"
build_output_contains = ""

[verification.cases.build_variables]
ROOTKITLINGS_FAIL_POINT = "0"

[[verification.cases]]
id = "preflight-rejection"
label = "Preflight rejection"
expect_build = "pass"
check = "curriculum/L03-proc-publication/checks/failure-ecanceled-check"
build_output_contains = ""

[verification.cases.build_variables]
ROOTKITLINGS_FAIL_POINT = "1"

[[verification.cases]]
id = "allocation-rejection"
label = "State allocation rejection"
expect_build = "pass"
check = "curriculum/L03-proc-publication/checks/failure-enomem-check"
build_output_contains = ""

[verification.cases.build_variables]
ROOTKITLINGS_FAIL_POINT = "2"

[[verification.cases]]
id = "publication-rollback"
label = "Publication rollback"
expect_build = "pass"
check = "curriculum/L03-proc-publication/checks/failure-after-state-check"
build_output_contains = ""

[verification.cases.build_variables]
ROOTKITLINGS_FAIL_POINT = "3"

[[verification.cases]]
id = "unknown-failure-point"
label = "Reject unknown failure point"
expect_build = "fail"
check = ""
build_output_contains = "unknown ROOTKITLINGS_FAIL_POINT"

[verification.cases.build_variables]
ROOTKITLINGS_FAIL_POINT = "99"
