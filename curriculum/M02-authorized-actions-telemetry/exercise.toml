schema_version = 2
id = "authorized-actions-telemetry"
title = "Protect the root command and record activity"
stage = "identity-observation"
kind = "milestone"
status = "required"
tradecraft = ["privilege", "instrumentation", "detection"]
difficulty = "standard"
prerequisites = ["controlled-resident-core", "one-use-authorization", "return-aware-syscall-telemetry"]
teaches = ["spinlocked-event-ring", "authorized-telemetry-integration"]
requires = ["resident-core-integration", "one-use-authorization", "return-correlation"]

[workspace]
mode = "cumulative"
files = ["Kbuild", "core/main.c", "core/state.c", "include/rootkit.h", "interface/proc.c", "execution/worker.c", "execution/scheduler.c", "control/authorization.c", "privilege/credentials.c", "instrumentation/events.c", "instrumentation/return_probe.c"]
editable = ["Kbuild", "include/rootkit.h", "core/main.c", "interface/proc.c", "control/authorization.c", "instrumentation/return_probe.c", "instrumentation/events.c"]
build = "."
baseline = "parent"
parent = "controlled-resident-core"
additions = "curriculum/M02-authorized-actions-telemetry/starter"
imports = [
  { exercise = "one-use-authorization", files = ["control/authorization.c", "privilege/credentials.c"] },
  { exercise = "return-aware-syscall-telemetry", files = ["instrumentation/return_probe.c"] },
]

[resources]
readme = "curriculum/M02-authorized-actions-telemetry/README.md"
check = "curriculum/M02-authorized-actions-telemetry/checks/success-check"
host_check = "curriculum/M02-authorized-actions-telemetry/checks/host-check"
hint = "curriculum/M02-authorized-actions-telemetry/hint"
solution = "curriculum/M02-authorized-actions-telemetry/solution"

[verification]
timeout_seconds = 240
capabilities = []
tools = ["module-load-test", "event-stream-test", "status-field-test", "proc-write-test", "proc-read-test", "credential-trigger-test", "rmdir-telemetry-test", "run-as"]
cleanup_required = true

[[verification.cases]]
id = "normal-integration"
label = "Authorized action telemetry"
expect_build = "pass"
check = "curriculum/M02-authorized-actions-telemetry/checks/success-check"
build_output_contains = ""

[verification.cases.build_variables]
ROOTKITLINGS_FAIL_POINT = "0"

[[verification.cases]]
id = "preflight-rejection"
label = "Preflight rejection"
expect_build = "pass"
check = "curriculum/M02-authorized-actions-telemetry/checks/failure-check.in"
build_output_contains = ""
check_arguments = ["125", "Preflight", "0"]

[verification.cases.build_variables]
ROOTKITLINGS_FAIL_POINT = "1"

[[verification.cases]]
id = "allocation-rejection"
label = "State allocation rejection"
expect_build = "pass"
check = "curriculum/M02-authorized-actions-telemetry/checks/failure-check.in"
build_output_contains = ""
check_arguments = ["12", "Allocation", "0"]

[verification.cases.build_variables]
ROOTKITLINGS_FAIL_POINT = "2"

[[verification.cases]]
id = "control-publication-rejection"
label = "Control publication rejection"
expect_build = "pass"
check = "curriculum/M02-authorized-actions-telemetry/checks/failure-check.in"
build_output_contains = ""
check_arguments = ["12", "Control publication", "1"]

[verification.cases.build_variables]
ROOTKITLINGS_FAIL_POINT = "3"

[[verification.cases]]
id = "worker-start-rejection"
label = "Worker start rejection"
expect_build = "pass"
check = "curriculum/M02-authorized-actions-telemetry/checks/failure-check.in"
build_output_contains = ""
check_arguments = ["4", "Worker", "1"]

[verification.cases.build_variables]
ROOTKITLINGS_FAIL_POINT = "4"

[[verification.cases]]
id = "authorization-start-rejection"
label = "Authorization startup rejection"
expect_build = "pass"
check = "curriculum/M02-authorized-actions-telemetry/checks/failure-check.in"
build_output_contains = ""
check_arguments = ["4", "Authorization startup", "1"]

[verification.cases.build_variables]
ROOTKITLINGS_FAIL_POINT = "5"

[[verification.cases]]
id = "missing-return-target"
label = "Missing Kretprobe target"
expect_build = "pass"
check = "curriculum/M02-authorized-actions-telemetry/checks/failure-check.in"
build_output_contains = ""
check_arguments = ["2", "Missing Kretprobe target", "1"]

[verification.cases.build_variables]
ROOTKITLINGS_FAIL_POINT = "6"

[[verification.cases]]
id = "events-publication-rejection"
label = "Events publication rejection"
expect_build = "pass"
check = "curriculum/M02-authorized-actions-telemetry/checks/failure-check.in"
build_output_contains = ""
check_arguments = ["12", "Events publication", "1"]

[verification.cases.build_variables]
ROOTKITLINGS_FAIL_POINT = "7"

[[verification.cases]]
id = "credential-prepare-rejection"
label = "Credential preparation rejection"
expect_build = "pass"
check = "curriculum/M02-authorized-actions-telemetry/checks/action-failure-check.in"
build_output_contains = ""
check_arguments = ["12", "Credential preparation"]

[verification.cases.build_variables]
