schema_version = 2
id = "proc-publication"
title = "Publish a procfs status file"
stage = "module-core"
kind = "lesson"
tradecraft = ["lifecycle", "control", "detection"]
difficulty = "standard"
prerequisites = ["owned-kernel-state"]
teaches = ["initialization-rollback", "resource-ownership", "proc-entry", "proc-publication-lifetime"]
requires = ["init-failure", "errno-propagation", "component-ownership", "kernel-allocation", "error-pointers", "pointer-invalidation", "build-time-failure-injection"]

[workspace]
mode = "cumulative"
files = ["Kbuild", "core/main.c", "core/state.c", "include/rootkit.h", "interface/proc.c"]
editable = ["Kbuild", "core/main.c", "include/rootkit.h", "interface/proc.c"]
build = "."
baseline = "parent"
parent = "owned-kernel-state"
additions = "curriculum/L03-proc-publication/starter"

[resources]
readme = "curriculum/L03-proc-publication/README.md"
host_check = "curriculum/L03-proc-publication/checks/host-check"
hint = "curriculum/L03-proc-publication/hint"
solution = "curriculum/L03-proc-publication/solution"

[verification]
timeout_seconds = 120
tools = ["module-load-test"]

[[verification.cases]]
id = "normal-publication"
label = "Normal procfs lifetime"
expect_build = "pass"
check = "curriculum/L03-proc-publication/checks/success-check"

[verification.cases.build_variables]
RKLINGS_FAIL_POINT = "0"

[[verification.cases]]
id = "preflight-rejection"
label = "Preflight rejection"
expect_build = "pass"
check = "curriculum/L03-proc-publication/checks/failure-ecanceled-check"

[verification.cases.build_variables]
RKLINGS_FAIL_POINT = "1"

[[verification.cases]]
id = "allocation-rejection"
label = "State allocation rejection"
expect_build = "pass"
check = "curriculum/L03-proc-publication/checks/failure-enomem-check"

[verification.cases.build_variables]
RKLINGS_FAIL_POINT = "2"

[[verification.cases]]
id = "publication-rollback"
label = "Publication rollback"
expect_build = "pass"
check = "curriculum/L03-proc-publication/checks/failure-after-state-check"

[verification.cases.build_variables]
RKLINGS_FAIL_POINT = "3"

[[verification.cases]]
id = "unknown-failure-point"
label = "Reject unknown failure point"
expect_build = "fail"
build_output_contains = "unknown RKLINGS_FAIL_POINT"

[verification.cases.build_variables]
RKLINGS_FAIL_POINT = "99"
