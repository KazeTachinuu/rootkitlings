schema_version = 2
id = "pid-escalation"
title = "Escalate another process by PID"
stage = "escalation"
kind = "lesson"
tradecraft = ["privilege", "control"]
difficulty = "standard"
prerequisites = ["mkdir-escalation", "proc-publication"]
teaches = ["deferred-execution", "atomic-flag", "pid-targeting"]
requires = []

[workspace]
mode = "project"
files = ["Kbuild", "main.c"]
editable = ["main.c"]
build = "."
baseline = "starter"
source = "curriculum/L07-pid-escalation/starter"

[resources]
readme = "curriculum/L07-pid-escalation/README.md"
host_check = ""
hint = "curriculum/L07-pid-escalation/hint"
solution = "curriculum/L07-pid-escalation/solution"

[verification]
timeout_seconds = 120
tools = ["module-load-test"]

[[verification.cases]]
id = "self-escalation"
label = "mkdir rklings.e grants root to calling process"
expect_build = "pass"
check = "vm/checks/module-loads"

[[verification.cases]]
id = "pid-targeting"
label = "mkdir rklings.e.PID sets deferred target"
expect_build = "pass"
check = "vm/checks/module-loads"

[[verification.cases]]
id = "deferred-delivery"
label = "Target PID gets root on /proc/rklings read"
expect_build = "pass"
check = "vm/checks/module-loads"
