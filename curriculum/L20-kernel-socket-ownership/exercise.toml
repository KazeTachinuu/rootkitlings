schema_version = 2
id = "kernel-socket-ownership"
title = "Open and close a kernel call-home socket"
stage = "network-state"
kind = "lesson"
status = "required"
tradecraft = ["networking", "lifecycle", "detection"]
difficulty = "advanced"
prerequisites = ["proc-publication"]
teaches = ["kernel-sockets", "socket-lifecycle", "kernel-socket-context-constraints"]
requires = ["resource-ownership", "transport-endpoint-basics"]

[workspace]
mode = "project"
files = ["Kbuild", "core/main.c", "include/rootkit.h", "interface/proc.c", "network/socket_owner.c"]
editable = ["network/socket_owner.c"]
build = "."
baseline = "starter"
source = "curriculum/L20-kernel-socket-ownership/starter"

[resources]
readme = "curriculum/L20-kernel-socket-ownership/README.md"
check = "curriculum/L20-kernel-socket-ownership/checks/success-check"
host_check = "curriculum/L20-kernel-socket-ownership/checks/host-check"
hint = "curriculum/L20-kernel-socket-ownership/hint"
solution = "curriculum/L20-kernel-socket-ownership/solution"

[verification]
timeout_seconds = 360
capabilities = []
tools = ["module-load-test", "module-load-params", "proc-read-test", "socket-owner-fixture"]
cleanup_required = true

[[verification.cases]]
id = "owned-socket-lifecycle"
label = "Owned kernel TCP socket lifecycle"
expect_build = "pass"
check = "curriculum/L20-kernel-socket-ownership/checks/success-check"
build_output_contains = ""
[verification.cases.build_variables]
ROOTKITLINGS_FAIL_POINT = "0"

[[verification.cases]]
id = "configuration-and-connect-errors"
label = "Socket configuration and connect errors"
expect_build = "pass"
check = "curriculum/L20-kernel-socket-ownership/checks/validation-check"
build_output_contains = ""
[verification.cases.build_variables]
ROOTKITLINGS_FAIL_POINT = "0"

[[verification.cases]]
id = "creation-rollback"
label = "Rollback after socket creation"
expect_build = "pass"
check = "curriculum/L20-kernel-socket-ownership/checks/failure-check.in"
build_output_contains = ""
check_arguments = ["125", "Rollback after socket creation", "0"]
[verification.cases.build_variables]
ROOTKITLINGS_FAIL_POINT = "1"

[[verification.cases]]
id = "capture-rollback"
label = "Rollback after connected endpoint capture"
expect_build = "pass"
check = "curriculum/L20-kernel-socket-ownership/checks/failure-check.in"
build_output_contains = ""
check_arguments = ["125", "Rollback after connected endpoint capture", "1"]
[verification.cases.build_variables]
ROOTKITLINGS_FAIL_POINT = "2"

[[verification.cases]]
id = "publication-rollback"
label = "Proc publication rollback"
expect_build = "pass"
check = "curriculum/L20-kernel-socket-ownership/checks/failure-check.in"
build_output_contains = ""
check_arguments = ["12", "Proc publication rollback", "1"]
[verification.cases.build_variables]
ROOTKITLINGS_FAIL_POINT = "3"

[[verification.cases]]
id = "unknown-failure-point"
label = "Reject unknown failure point"
expect_build = "fail"
check = ""
build_output_contains = "unknown ROOTKITLINGS_FAIL_POINT"
[verification.cases.build_variables]
ROOTKITLINGS_FAIL_POINT = "99"
