schema_version = 2
id = "linux-credential-model"
title = "Interpret the current task's credentials"
stage = "identity-observation"
kind = "lesson"
status = "required"
tradecraft = ["privilege", "detection"]
difficulty = "standard"
prerequisites = ["current-task-attribution"]
teaches = ["task-credentials", "namespace-id-translation", "namespaced-capabilities"]
requires = ["current-task", "linux-identity-basics"]

[workspace]
mode = "cumulative"
files = ["Kbuild", "core/main.c", "core/state.c", "include/rootkit.h", "interface/proc.c"]
editable = ["interface/proc.c"]
build = "."
baseline = "scaffold"
module_artifact = "rootkitlings.ko"
source = "curriculum/required/linux-credential-model/starter"
parent = "current-task-attribution"

[resources]
readme = "curriculum/required/linux-credential-model/README.md"
check = "curriculum/required/linux-credential-model/checks/success-check"
host_check = "curriculum/required/linux-credential-model/checks/host-check"
hint = "curriculum/required/linux-credential-model/hint"
solution = "curriculum/required/linux-credential-model/solution"

[verification]
timeout_seconds = 180
capabilities = []
tools = ["module-load-test", "credential-snapshot-test", "run-as"]
cleanup_required = true

[[verification.cases]]
id = "normal-credentials"
label = "Credential and namespace views"
expect_build = "pass"
check = "curriculum/required/linux-credential-model/checks/success-check"
build_output_contains = ""

[verification.cases.build_variables]
ROOTKITLINGS_FAIL_POINT = "0"

[[verification.cases]]
id = "preflight-rejection"
label = "Preflight rejection"
expect_build = "pass"
check = "curriculum/required/proc-publication/checks/failure-ecanceled-check"
build_output_contains = ""

[verification.cases.build_variables]
ROOTKITLINGS_FAIL_POINT = "1"

[[verification.cases]]
id = "allocation-rejection"
label = "State allocation rejection"
expect_build = "pass"
check = "curriculum/required/proc-publication/checks/failure-enomem-check"
build_output_contains = ""

[verification.cases.build_variables]
ROOTKITLINGS_FAIL_POINT = "2"

[[verification.cases]]
id = "publication-rollback"
label = "Publication rollback"
expect_build = "pass"
check = "curriculum/required/proc-publication/checks/failure-after-state-check"
build_output_contains = ""

[verification.cases.build_variables]
ROOTKITLINGS_FAIL_POINT = "3"

[[verification.cases]]
id = "unknown-failure-point"
label = "Reject unknown failure point"
expect_build = "fail"
check = ""
build_output_contains = "unknown ROOTKITLINGS_FAIL_POINT"

[verification.cases.build_variables]
ROOTKITLINGS_FAIL_POINT = "99"
