schema_version = 2
id = "cross-view-evidence"
title = "Omit one live probe from a proc view"
stage = "views-detection"
kind = "lesson"
status = "required"
tradecraft = ["detection", "concealment"]
difficulty = "standard"
prerequisites = ["managed-kprobe"]
teaches = ["cross-view-evidence", "positive-negative-controls"]
requires = ["proc-read", "kprobes"]

[workspace]
mode = "cumulative"
files = ["Kbuild", "core/main.c", "core/state.c", "include/rootkit.h", "instrumentation/probes.c", "interface/proc.c"]
editable = ["interface/proc.c"]
build = "."
baseline = "scaffold"
source = "curriculum/required/cross-view-evidence/starter"
parent = "managed-kprobe"

[resources]
readme = "curriculum/required/cross-view-evidence/README.md"
check = "curriculum/required/cross-view-evidence/checks/success-check"
host_check = "curriculum/required/cross-view-evidence/checks/learner-host-check"
hint = "curriculum/required/cross-view-evidence/hint"
solution = "curriculum/required/cross-view-evidence/solution"

[verification]
timeout_seconds = 240
capabilities = []
tools = ["module-load-test", "proc-read-test", "proc-write-test", "run-as"]
cleanup_required = true

[[verification.cases]]
id = "selected-view-suppression"
label = "Cross-view probe evidence"
expect_build = "pass"
check = "curriculum/required/cross-view-evidence/checks/success-check"
build_output_contains = ""
[verification.cases.build_variables]
ROOTKITLINGS_FAIL_POINT = "0"

[[verification.cases]]
id = "preflight-rejection"
label = "Preflight rejection"
expect_build = "pass"
check = "curriculum/required/proc-publication/checks/failure-ecanceled-check"
build_output_contains = ""
[verification.cases.build_variables]
ROOTKITLINGS_FAIL_POINT = "1"

[[verification.cases]]
id = "allocation-rejection"
label = "State allocation rejection"
expect_build = "pass"
check = "curriculum/required/proc-publication/checks/failure-enomem-check"
build_output_contains = ""
[verification.cases.build_variables]
ROOTKITLINGS_FAIL_POINT = "2"

[[verification.cases]]
id = "publication-rollback"
label = "Probe cleanup after procfs publication failure"
expect_build = "pass"
check = "curriculum/required/cross-view-evidence/checks/probe-failure-check.in"
build_output_contains = ""
check_arguments = ["12", "Probe cleanup after procfs publication failure"]
[verification.cases.build_variables]
ROOTKITLINGS_FAIL_POINT = "3"

[[verification.cases]]
id = "missing-target-rollback"
label = "Batch rollback after a missing second symbol"
expect_build = "pass"
check = "curriculum/required/cross-view-evidence/checks/probe-failure-check.in"
build_output_contains = ""
check_arguments = ["2", "Batch rollback after a missing second symbol"]
[verification.cases.build_variables]
ROOTKITLINGS_FAIL_POINT = "4"

[[verification.cases]]
id = "unknown-failure-point"
label = "Reject unknown failure point"
expect_build = "fail"
check = ""
build_output_contains = "unknown ROOTKITLINGS_FAIL_POINT"
[verification.cases.build_variables]
ROOTKITLINGS_FAIL_POINT = "99"
