schema_version = 2
id = "owned-kernel-state"
title = "Allocate and own private kernel state"
stage = "module-core"
kind = "lesson"
status = "required"
tradecraft = ["lifecycle", "detection"]
difficulty = "standard"
prerequisites = ["precise-init-failure"]
teaches = ["multi-file-modules", "component-ownership", "kernel-allocation", "error-pointers", "pointer-invalidation"]
requires = ["module-build", "init-failure", "errno-propagation", "build-time-failure-injection", "c-pointers-and-structs"]

[workspace]
mode = "cumulative"
files = ["Kbuild", "core/main.c", "core/state.c", "include/rootkit.h"]
editable = ["Kbuild", "core/main.c", "core/state.c", "include/rootkit.h"]
build = "."
baseline = "previous-required"
additions = "curriculum/required/owned-kernel-state/starter"

[resources]
readme = "curriculum/required/owned-kernel-state/README.md"
check = "curriculum/required/module-build-lifecycle/checks/module-lifecycle-check"
host_check = "curriculum/required/owned-kernel-state/checks/host-check"
hint = "curriculum/required/owned-kernel-state/hint"
solution = "curriculum/required/owned-kernel-state/solution"

[verification]
timeout_seconds = 120
capabilities = []
tools = ["module-load-test"]
cleanup_required = true

[[verification.cases]]
id = "normal-lifecycle"
label = "Normal state lifetime"
expect_build = "pass"
check = "curriculum/required/module-build-lifecycle/checks/module-lifecycle-check"
build_output_contains = ""

[verification.cases.build_variables]
ROOTKITLINGS_FAIL_POINT = "0"

[[verification.cases]]
id = "preflight-rejection"
label = "Preflight rejection"
expect_build = "pass"
check = "curriculum/required/owned-kernel-state/checks/failure-ecanceled-check"
build_output_contains = ""

[verification.cases.build_variables]
ROOTKITLINGS_FAIL_POINT = "1"

[[verification.cases]]
id = "allocation-rejection"
label = "State allocation rejection"
expect_build = "pass"
check = "curriculum/required/owned-kernel-state/checks/failure-enomem-check"
build_output_contains = ""

[verification.cases.build_variables]
ROOTKITLINGS_FAIL_POINT = "2"

[[verification.cases]]
id = "unknown-failure-point"
label = "Reject unknown failure point"
expect_build = "fail"
check = ""
build_output_contains = "unknown ROOTKITLINGS_FAIL_POINT"

[verification.cases.build_variables]
ROOTKITLINGS_FAIL_POINT = "99"
