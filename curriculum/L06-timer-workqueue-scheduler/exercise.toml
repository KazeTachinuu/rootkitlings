schema_version = 2
id = "timer-workqueue-scheduler"
title = "Drive a workqueue from a kernel timer"
stage = "control-execution"
kind = "lesson"
tradecraft = ["execution", "lifecycle"]
difficulty = "standard"
prerequisites = ["bounded-control-switch"]
teaches = ["kernel-timers", "workqueues", "timer-to-worker-deferral", "deferred-work-lifecycle"]
requires = ["resource-ownership", "read-once-write-once", "action-control-switch", "state-invariant-selection"]

[workspace]
mode = "cumulative"
files = ["Kbuild", "core/main.c", "core/state.c", "include/rootkit.h", "interface/proc.c", "execution/scheduler.c"]
editable = ["Kbuild", "core/main.c", "execution/scheduler.c"]
build = "."
baseline = "scaffold"
source = "curriculum/L06-timer-workqueue-scheduler/starter"
parent = "bounded-control-switch"

[resources]
readme = "curriculum/L06-timer-workqueue-scheduler/README.md"
host_check = "curriculum/L06-timer-workqueue-scheduler/checks/host-check"
hint = "curriculum/L06-timer-workqueue-scheduler/hint"
solution = "curriculum/L06-timer-workqueue-scheduler/solution"

[verification]
timeout_seconds = 120
tools = ["module-load-test", "proc-write-test", "run-as", "status-field-test"]

[[verification.cases]]
id = "normal-scheduler"
label = "Timer and workqueue lifecycle"
expect_build = "pass"
check = "curriculum/L06-timer-workqueue-scheduler/checks/success-check"

[verification.cases.build_variables]
RKLINGS_FAIL_POINT = "0"

[[verification.cases]]
id = "preflight-rejection"
label = "Preflight rejection"
expect_build = "pass"
check = "curriculum/L03-proc-publication/checks/failure-ecanceled-check"

[verification.cases.build_variables]
RKLINGS_FAIL_POINT = "1"

[[verification.cases]]
id = "allocation-rejection"
label = "State allocation rejection"
expect_build = "pass"
check = "curriculum/L03-proc-publication/checks/failure-enomem-check"

[verification.cases.build_variables]
RKLINGS_FAIL_POINT = "2"

[[verification.cases]]
id = "publication-rollback"
label = "Publication rollback"
expect_build = "pass"
check = "curriculum/L03-proc-publication/checks/failure-after-state-check"

[verification.cases.build_variables]
RKLINGS_FAIL_POINT = "3"

[[verification.cases]]
id = "unknown-failure-point"
label = "Reject unknown failure point"
expect_build = "fail"
build_output_contains = "unknown RKLINGS_FAIL_POINT"

[verification.cases.build_variables]
RKLINGS_FAIL_POINT = "99"
