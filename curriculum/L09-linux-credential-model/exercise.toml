schema_version = 2
id = "linux-credential-model"
title = "Read the caller's kernel identity"
stage = "identity-observation"
kind = "lesson"
tradecraft = ["privilege", "detection"]
difficulty = "standard"
prerequisites = ["current-task-attribution"]
teaches = ["task-credentials", "namespace-id-translation", "namespaced-capabilities"]
requires = ["current-task", "linux-identity-basics"]

[workspace]
mode = "cumulative"
files = ["Kbuild", "core/main.c", "core/state.c", "include/rootkit.h", "interface/proc.c"]
editable = ["interface/proc.c"]
build = "."
baseline = "scaffold"
source = "curriculum/L09-linux-credential-model/starter"
parent = "current-task-attribution"

[resources]
readme = "curriculum/L09-linux-credential-model/README.md"
host_check = "curriculum/L09-linux-credential-model/checks/host-check"
hint = "curriculum/L09-linux-credential-model/hint"
solution = "curriculum/L09-linux-credential-model/solution"

[verification]
timeout_seconds = 180
tools = ["module-load-test", "credential-snapshot-test", "run-as"]

[[verification.cases]]
id = "normal-credentials"
label = "Credential and namespace views"
expect_build = "pass"
check = "curriculum/L09-linux-credential-model/checks/success-check"

[verification.cases.build_variables]
RKLINGS_FAIL_POINT = "0"

[[verification.cases]]
id = "preflight-rejection"
label = "Preflight rejection"
expect_build = "pass"
check = "curriculum/L03-proc-publication/checks/failure-ecanceled-check"

[verification.cases.build_variables]
RKLINGS_FAIL_POINT = "1"

[[verification.cases]]
id = "allocation-rejection"
label = "State allocation rejection"
expect_build = "pass"
check = "curriculum/L03-proc-publication/checks/failure-enomem-check"

[verification.cases.build_variables]
RKLINGS_FAIL_POINT = "2"

[[verification.cases]]
id = "publication-rollback"
label = "Publication rollback"
expect_build = "pass"
check = "curriculum/L03-proc-publication/checks/failure-after-state-check"

[verification.cases.build_variables]
RKLINGS_FAIL_POINT = "3"

[[verification.cases]]
id = "unknown-failure-point"
label = "Reject unknown failure point"
expect_build = "fail"
build_output_contains = "unknown RKLINGS_FAIL_POINT"

[verification.cases.build_variables]
RKLINGS_FAIL_POINT = "99"
