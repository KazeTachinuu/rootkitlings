schema_version = 2
id = "module-cloak"
title = "Hide the module from lsmod"
stage = "identity-observation"
kind = "milestone"
tradecraft = ["concealment", "lifecycle"]
difficulty = "standard"
prerequisites = ["return-aware-syscall-telemetry"]
teaches = ["list-del-module-hiding"]
requires = ["module-lifecycle", "proc-write"]

[workspace]
mode = "project"
files = ["Kbuild", "main.c"]
editable = ["main.c"]
build = "."
baseline = "starter"
source = "curriculum/M01-module-cloak/starter"

[resources]
readme = "curriculum/M01-module-cloak/README.md"
host_check = ""
hint = "curriculum/M01-module-cloak/hint"
solution = "curriculum/M01-module-cloak/solution"

[verification]
timeout_seconds = 120
tools = ["module-load-test", "proc-write-test"]

[[verification.cases]]
id = "module-cloaked"
label = "Module hidden from lsmod after cloak"
expect_build = "pass"
check = "curriculum/M01-module-cloak/checks/success-check"

[[verification.cases]]
id = "module-uncloaked"
label = "Module visible after uncloak"
expect_build = "pass"
check = "curriculum/M01-module-cloak/checks/uncloak-check"

[[verification.cases]]
id = "unknown-failure-point"
label = "Reject unknown failure point"
expect_build = "fail"
build_output_contains = "unknown RKLINGS_FAIL_POINT"
[verification.cases.build_variables]
RKLINGS_FAIL_POINT = "99"
