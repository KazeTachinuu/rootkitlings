schema_version = 2
id = "tcp-port-filter"
title = "Hide a listening port from /proc/net/tcp"
stage = "views-detection"
kind = "lesson"
tradecraft = ["concealment", "instrumentation"]
difficulty = "standard"
prerequisites = ["cross-view-evidence", "authenticated-encryption"]
teaches = ["tcp-seq-show-suppression"]
requires = ["kprobes", "seq-file-item-suppression"]

[workspace]
mode = "project"
files = ["Kbuild", "main.c"]
editable = ["main.c"]
build = "."
baseline = "starter"
source = "curriculum/L26-tcp-port-filter/starter"

[resources]
readme = "curriculum/L26-tcp-port-filter/README.md"
host_check = ""
hint = "curriculum/L26-tcp-port-filter/hint"
solution = "curriculum/L26-tcp-port-filter/solution"

[verification]
timeout_seconds = 120
tools = ["module-load-params"]

[[verification.cases]]
id = "port-hidden"
label = "Target port hidden from /proc/net/tcp"
expect_build = "pass"
check = "curriculum/L26-tcp-port-filter/checks/success-check"

[[verification.cases]]
id = "other-ports-visible"
label = "Non-target ports remain visible"
expect_build = "pass"
check = "curriculum/L26-tcp-port-filter/checks/negative-check"
