schema_version = 2
id = "tcp-framing-cancellation"
title = "Run one cancellable framed TCP session"
stage = "network-state"
kind = "lesson"
status = "required"
tradecraft = ["networking", "control", "execution", "lifecycle"]
difficulty = "advanced"
prerequisites = ["event-driven-kernel-thread", "kernel-socket-ownership"]
teaches = ["tcp-length-framing", "partial-stream-io", "oversized-frame-draining", "blocked-io-cancellation", "single-socket-ownership"]
requires = ["worker-stop-lifecycle", "socket-lifecycle", "transport-endpoint-basics"]

[workspace]
mode = "project"
files = ["Kbuild", "core/main.c", "include/rootkit.h", "interface/proc.c", "session/tcp_session.c", "tests/selftest.c"]
editable = ["session/tcp_session.c"]
build = "."
baseline = "template"
source = "curriculum/L23-tcp-framing-cancellation/starter"

[resources]
readme = "curriculum/L23-tcp-framing-cancellation/README.md"
check = "curriculum/L23-tcp-framing-cancellation/checks/success-check"
host_check = "curriculum/L23-tcp-framing-cancellation/checks/host-check"
hint = "curriculum/L23-tcp-framing-cancellation/hint"
solution = "curriculum/L23-tcp-framing-cancellation/solution"

[verification]
timeout_seconds = 360
capabilities = []
tools = ["module-load-params", "proc-read-test", "tcp-session-fixture"]
cleanup_required = true

[[verification.cases]]
id = "framed-session-lifecycle"
label = "Cancellable framed TCP session"
expect_build = "pass"
check = "curriculum/L23-tcp-framing-cancellation/checks/success-check"
build_output_contains = ""
[verification.cases.build_variables]
ROOTKITLINGS_FAIL_POINT = "0"

[[verification.cases]]
id = "worker-creation-rollback"
label = "Worker creation failure"
expect_build = "pass"
check = "curriculum/L23-tcp-framing-cancellation/checks/failure-check.in"
build_output_contains = ""
check_arguments = ["4", "Worker creation failure", "0"]
[verification.cases.build_variables]
ROOTKITLINGS_FAIL_POINT = "1"

[[verification.cases]]
id = "publication-rollback"
label = "Proc publication rollback"
expect_build = "pass"
check = "curriculum/L23-tcp-framing-cancellation/checks/failure-check.in"
build_output_contains = ""
check_arguments = ["12", "Proc publication rollback", "1"]
[verification.cases.build_variables]
ROOTKITLINGS_FAIL_POINT = "2"

[[verification.cases]]
id = "unknown-failure-point"
label = "Reject unknown failure point"
expect_build = "fail"
check = ""
build_output_contains = "unknown ROOTKITLINGS_FAIL_POINT"
[verification.cases.build_variables]
ROOTKITLINGS_FAIL_POINT = "99"
