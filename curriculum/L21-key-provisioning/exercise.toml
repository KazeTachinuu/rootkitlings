schema_version = 2
id = "key-provisioning"
title = "Provision and rotate a shared key"
stage = "crypto"
kind = "lesson"
tradecraft = ["crypto"]
difficulty = "standard"
prerequisites = ["secure-envelope"]
teaches = ["key-provisioning", "key-rotation", "key-zeroization"]
requires = []

[workspace]
mode = "project"
files = ["Kbuild", "main.c"]
editable = ["main.c"]
build = "."
baseline = "starter"
source = "curriculum/L21-key-provisioning/starter"

[resources]
readme = "curriculum/L21-key-provisioning/README.md"
host_check = ""
hint = "curriculum/L21-key-provisioning/hint"
solution = "curriculum/L21-key-provisioning/solution"

[verification]
timeout_seconds = 120
tools = ["module-load-test"]

[[verification.cases]]
id = "key-load-rotate"
label = "Key loading, rotation, and zeroization"
expect_build = "pass"
check = "curriculum/L21-key-provisioning/checks/key-load-rotate"
check_arguments = ["control_key=000102030405060708090a0b0c0d0e0f101112131415161718191a1b1c1d1e1f"]
