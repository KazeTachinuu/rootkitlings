schema_version = 2
id = "reversible-persistence"
title = "Persist across reboot and hide from lsmod"
stage = "persistence-concealment"
kind = "milestone"
tradecraft = ["persistence", "concealment"]
difficulty = "standard"
prerequisites = ["command-dispatcher"]
teaches = ["call-usermodehelper", "list-del-module-hiding", "modules-load-d"]
requires = ["kretprobe-dispatcher", "linked-list"]

[workspace]
mode = "project"
files = ["Kbuild", "main.c"]
editable = ["main.c"]
build = "."
baseline = "starter"
source = "curriculum/M00-reversible-persistence/starter"

[resources]
readme = "curriculum/M00-reversible-persistence/README.md"
host_check = ""
hint = "curriculum/M00-reversible-persistence/hint"
solution = "curriculum/M00-reversible-persistence/solution"

[verification]
timeout_seconds = 120
tools = ["module-load-test", "mkdir-escalation-test"]

[[verification.cases]]
id = "persistence"
label = "mkdir rklings.persist writes modules-load.d conf"
expect_build = "pass"
check = "curriculum/M00-reversible-persistence/checks/persist-check"

[[verification.cases]]
id = "unpersist"
label = "mkdir rklings.unpersist removes conf"
expect_build = "pass"
check = "curriculum/M00-reversible-persistence/checks/unpersist-check"

[[verification.cases]]
id = "cloak"
label = "mkdir rklings.h.m hides module from lsmod"
expect_build = "pass"
check = "curriculum/M00-reversible-persistence/checks/cloak-check"

[[verification.cases]]
id = "uncloak"
label = "mkdir rklings.u.m restores module visibility"
expect_build = "pass"
check = "curriculum/M00-reversible-persistence/checks/uncloak-check"
