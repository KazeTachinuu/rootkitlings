schema_version = 2
id = "dirent-filter"
title = "Hide files and PIDs from directory listings"
stage = "concealment"
kind = "lesson"
tradecraft = ["concealment"]
difficulty = "standard"
prerequisites = ["command-dispatcher", "target-list"]
teaches = ["getdents-interception", "dirent-buffer-parsing", "in-place-filtering"]
requires = []

[workspace]
mode = "project"
files = ["Kbuild", "main.c"]
editable = ["main.c"]
build = "."
baseline = "starter"
source = "curriculum/L11-dirent-filter/starter"

[resources]
readme = "curriculum/L11-dirent-filter/README.md"
host_check = ""
hint = "curriculum/L11-dirent-filter/hint"
solution = "curriculum/L11-dirent-filter/solution"

[verification]
timeout_seconds = 120
tools = ["module-load-test"]

[[verification.cases]]
id = "hide-file"
label = "Hidden file vanishes from ls"
expect_build = "pass"
check = "vm/checks/module-loads"

[[verification.cases]]
id = "unhide-file"
label = "Unhidden file reappears"
expect_build = "pass"
check = "vm/checks/module-loads"

[[verification.cases]]
id = "hide-pid"
label = "Hidden PID vanishes from ps"
expect_build = "pass"
check = "vm/checks/module-loads"

[[verification.cases]]
id = "unhide-pid"
label = "Unhidden PID reappears"
expect_build = "pass"
check = "vm/checks/module-loads"
