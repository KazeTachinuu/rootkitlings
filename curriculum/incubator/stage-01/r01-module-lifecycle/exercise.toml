schema_version = 2
id = "module-build-lifecycle"
title = "Build, load, inspect, and unload a kernel module"
stage = "module-core"
kind = "lesson"
status = "required"
tradecraft = ["lifecycle", "detection"]
difficulty = "standard"
prerequisites = []
teaches = ["module-lifecycle", "module-build", "module-inspection"]
requires = ["c-functions-and-errors", "shell-and-paths", "host-guest-kernel-boundary"]

[workspace]
mode = "cumulative"
files = ["Kbuild", "core/main.c"]
editable = ["Kbuild", "core/main.c"]
build = "."
baseline = "template"
module_artifact = "rootkitlings.ko"
source = "curriculum/incubator/stage-01/r01-module-lifecycle/template"

[resources]
readme = "curriculum/incubator/stage-01/r01-module-lifecycle/README.md"
check = "curriculum/incubator/stage-01/support/module-lifecycle-check"
host_check = "curriculum/incubator/stage-01/r01-module-lifecycle/host-check"
hint = "curriculum/incubator/stage-01/r01-module-lifecycle/hint"
solution = "curriculum/incubator/stage-01/r01-module-lifecycle/solution"

[verification]
timeout_seconds = 120
capabilities = []
tools = []
cleanup_required = true

[[verification.cases]]
id = "normal-lifecycle"
label = "Normal load and unload"
expect_build = "pass"
check = "curriculum/incubator/stage-01/support/module-lifecycle-check"
build_output_contains = ""

[verification.cases.build_variables]
ROOTKITLINGS_FAIL_POINT = "0"
