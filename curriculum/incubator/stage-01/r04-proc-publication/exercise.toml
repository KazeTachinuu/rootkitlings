schema_version = 2
id = "proc-publication"
title = "Publish and roll back a procfs entry"
stage = "module-core"
kind = "lesson"
status = "required"
tradecraft = ["lifecycle", "control", "detection"]
difficulty = "standard"
prerequisites = ["owned-kernel-state"]
teaches = ["initialization-rollback", "resource-ownership", "proc-entry", "proc-publication-lifetime"]
requires = ["init-failure", "errno-propagation", "component-ownership", "kernel-allocation", "error-pointers", "pointer-invalidation", "build-time-failure-injection"]

[workspace]
mode = "cumulative"
files = ["Kbuild", "core/main.c", "core/state.c", "include/rootkit.h", "interface/proc.c"]
editable = ["Kbuild", "core/main.c", "include/rootkit.h", "interface/proc.c"]
build = "."
baseline = "previous-required"
module_artifact = "rootkitlings.ko"
additions = "curriculum/incubator/stage-01/r04-proc-publication/template"

[resources]
readme = "curriculum/incubator/stage-01/r04-proc-publication/README.md"
check = "curriculum/incubator/stage-01/r04-proc-publication/success-check"
host_check = "curriculum/incubator/stage-01/r04-proc-publication/host-check"
hint = "curriculum/incubator/stage-01/r04-proc-publication/hint"
solution = "curriculum/incubator/stage-01/r04-proc-publication/solution"

[verification]
timeout_seconds = 120
capabilities = []
tools = ["module-load-test"]
cleanup_required = true

[[verification.cases]]
id = "normal-publication"
label = "Normal procfs lifetime"
expect_build = "pass"
check = "curriculum/incubator/stage-01/r04-proc-publication/success-check"
build_output_contains = ""

[verification.cases.build_variables]
ROOTKITLINGS_FAIL_POINT = "0"

[[verification.cases]]
id = "preflight-rejection"
label = "Preflight rejection"
expect_build = "pass"
check = "curriculum/incubator/stage-01/r04-proc-publication/failure-ecanceled-check"
build_output_contains = ""

[verification.cases.build_variables]
ROOTKITLINGS_FAIL_POINT = "1"

[[verification.cases]]
id = "allocation-rejection"
label = "State allocation rejection"
expect_build = "pass"
check = "curriculum/incubator/stage-01/r04-proc-publication/failure-enomem-check"
build_output_contains = ""

[verification.cases.build_variables]
ROOTKITLINGS_FAIL_POINT = "2"

[[verification.cases]]
id = "publication-rollback"
label = "Publication rollback"
expect_build = "pass"
check = "curriculum/incubator/stage-01/r04-proc-publication/failure-after-state-check"
build_output_contains = ""

[verification.cases.build_variables]
ROOTKITLINGS_FAIL_POINT = "3"

[[verification.cases]]
id = "unknown-failure-point"
label = "Reject unknown failure point"
expect_build = "fail"
check = ""
build_output_contains = "unknown ROOTKITLINGS_FAIL_POINT"

[verification.cases.build_variables]
ROOTKITLINGS_FAIL_POINT = "99"
