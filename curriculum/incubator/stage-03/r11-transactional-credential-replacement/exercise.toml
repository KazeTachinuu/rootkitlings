schema_version = 2
id = "transactional-credential-replacement"
title = "Replace the writing task's credentials as one transaction"
stage = "identity-observation"
kind = "lesson"
status = "required"
tradecraft = ["privilege"]
difficulty = "standard"
prerequisites = ["bounded-control-switch", "linux-credential-model"]
teaches = ["credential-replacement"]
requires = ["kernel-allocation", "copy-validate-commit", "task-credentials", "namespaced-capabilities"]

[workspace]
mode = "cumulative"
files = ["Kbuild", "core/main.c", "core/state.c", "include/rootkit.h", "interface/proc.c", "privilege/credentials.c"]
editable = ["privilege/credentials.c"]
build = "."
baseline = "scaffold"
module_artifact = "rootkitlings.ko"
source = "curriculum/incubator/stage-03/r11-transactional-credential-replacement/template"
parent = "bounded-control-switch"

[resources]
readme = "curriculum/incubator/stage-03/r11-transactional-credential-replacement/README.md"
check = "curriculum/incubator/stage-03/r11-transactional-credential-replacement/success-check"
host_check = "curriculum/incubator/stage-03/r11-transactional-credential-replacement/learner-host-check"
hint = "curriculum/incubator/stage-03/r11-transactional-credential-replacement/hint"
solution = "curriculum/incubator/stage-03/r11-transactional-credential-replacement/solution"

[verification]
timeout_seconds = 180
capabilities = []
tools = ["module-load-test", "credential-trigger-test", "proc-write-test", "run-as"]
cleanup_required = true

[[verification.cases]]
id = "normal-replacement"
label = "Transactional credential replacement"
expect_build = "pass"
check = "curriculum/incubator/stage-03/r11-transactional-credential-replacement/success-check"
build_output_contains = ""

[verification.cases.build_variables]
ROOTKITLINGS_FAIL_POINT = "0"

[[verification.cases]]
id = "preflight-rejection"
label = "Preflight rejection"
expect_build = "pass"
check = "curriculum/incubator/stage-01/r04-proc-publication/failure-ecanceled-check"
build_output_contains = ""

[verification.cases.build_variables]
ROOTKITLINGS_FAIL_POINT = "1"

[[verification.cases]]
id = "allocation-rejection"
label = "State allocation rejection"
expect_build = "pass"
check = "curriculum/incubator/stage-01/r04-proc-publication/failure-enomem-check"
build_output_contains = ""

[verification.cases.build_variables]
ROOTKITLINGS_FAIL_POINT = "2"

[[verification.cases]]
id = "publication-rollback"
label = "Publication rollback"
expect_build = "pass"
check = "curriculum/incubator/stage-01/r04-proc-publication/failure-after-state-check"
build_output_contains = ""

[verification.cases.build_variables]
ROOTKITLINGS_FAIL_POINT = "3"

[[verification.cases]]
id = "credential-prepare-rejection"
label = "Credential preparation rejection"
expect_build = "pass"
check = "curriculum/incubator/stage-03/r11-transactional-credential-replacement/credential-failure-check.in"
build_output_contains = ""
check_arguments = ["12", "Credential preparation failure"]

[verification.cases.build_variables]
ROOTKITLINGS_FAIL_POINT = "4"

[[verification.cases]]
id = "credential-cancel-rejection"
label = "Credential cancellation"
expect_build = "pass"
check = "curriculum/incubator/stage-03/r11-transactional-credential-replacement/credential-failure-check.in"
build_output_contains = ""
check_arguments = ["125", "Credential cancellation"]

[verification.cases.build_variables]
ROOTKITLINGS_FAIL_POINT = "5"

[[verification.cases]]
id = "unknown-failure-point"
label = "Reject unknown failure point"
expect_build = "fail"
check = ""
build_output_contains = "unknown ROOTKITLINGS_FAIL_POINT"

[verification.cases.build_variables]
ROOTKITLINGS_FAIL_POINT = "99"
