schema_version = 2
id = "authenticated-replay-safe-message"
title = "Authenticate a message and reject replay"
stage = "authenticated-operations"
kind = "lesson"
status = "required"
tradecraft = ["cryptography", "control", "detection"]
difficulty = "advanced"
prerequisites = ["one-use-authorization", "sha256-verification"]
teaches = ["hmac-authentication", "replay-resistant-state"]
requires = ["replay-rejection", "kernel-crypto-api", "sha256-verification"]

[workspace]
mode = "project"
files = ["Kbuild", "core/main.c", "crypto/platform.c", "include/authenticated.h", "include/platform.h", "include/selftest.h", "message/authenticated.c", "tests/selftest.c"]
editable = ["message/authenticated.c"]
build = "."
baseline = "template"
module_artifact = "rootkitlings.ko"
source = "curriculum/incubator/stage-06/r29-authenticated-replay-safe-message/template"

[resources]
readme = "curriculum/incubator/stage-06/r29-authenticated-replay-safe-message/README.md"
check = "curriculum/incubator/stage-06/r29-authenticated-replay-safe-message/success-check"
host_check = "curriculum/incubator/stage-06/r29-authenticated-replay-safe-message/host-check"
hint = "curriculum/incubator/stage-06/r29-authenticated-replay-safe-message/hint"
solution = "curriculum/incubator/stage-06/r29-authenticated-replay-safe-message/solution"

[verification]
timeout_seconds = 360
capabilities = []
tools = ["module-load-test"]
cleanup_required = true

[[verification.cases]]
id = "authenticated-replay-transition"
label = "Authenticated replay-safe transition"
expect_build = "pass"
check = "curriculum/incubator/stage-06/r29-authenticated-replay-safe-message/success-check"
build_output_contains = ""
[verification.cases.build_variables]
ROOTKITLINGS_FAIL_POINT = "0"

[[verification.cases]]
id = "context-allocation-failure"
label = "Authentication context allocation failure"
expect_build = "pass"
check = "curriculum/incubator/stage-06/r29-authenticated-replay-safe-message/allocation-failure-check"
build_output_contains = ""
[verification.cases.build_variables]
ROOTKITLINGS_FAIL_POINT = "1"

[[verification.cases]]
id = "key-setup-failure"
label = "HMAC key setup failure"
expect_build = "pass"
check = "curriculum/incubator/stage-06/r29-authenticated-replay-safe-message/key-failure-check"
build_output_contains = ""
[verification.cases.build_variables]
ROOTKITLINGS_FAIL_POINT = "2"

[[verification.cases]]
id = "digest-failure"
label = "HMAC calculation failure"
expect_build = "pass"
check = "curriculum/incubator/stage-06/r29-authenticated-replay-safe-message/digest-failure-check"
build_output_contains = ""
[verification.cases.build_variables]
ROOTKITLINGS_FAIL_POINT = "3"

[[verification.cases]]
id = "unknown-failure-point"
label = "Reject unknown failure point"
expect_build = "fail"
check = ""
build_output_contains = "must be between 0 and 3"
[verification.cases.build_variables]
ROOTKITLINGS_FAIL_POINT = "99"
