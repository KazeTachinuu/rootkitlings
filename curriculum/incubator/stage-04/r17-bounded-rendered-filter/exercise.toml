schema_version = 2
id = "bounded-rendered-filter"
title = "Replace bytes in one bounded read result"
stage = "views-detection"
kind = "lesson"
status = "required"
tradecraft = ["concealment", "detection"]
difficulty = "advanced"
prerequisites = ["return-aware-syscall-telemetry", "cross-view-evidence"]
teaches = ["bounded-rendered-filter", "binary-safe-equal-width-replacement", "inode-identity-selection"]
requires = ["kretprobes", "nofault-user-copy", "kernel-abi-contract", "managed-hook-lifecycle", "cross-view-evidence"]

[workspace]
mode = "cumulative"
files = ["Kbuild", "core/main.c", "include/rootkit.h", "instrumentation/read_filter.c", "instrumentation/replace.c", "interface/proc.c"]
editable = ["instrumentation/replace.c"]
build = "."
baseline = "template"
module_artifact = "rootkitlings.ko"
source = "curriculum/incubator/stage-04/r17-bounded-rendered-filter/template"

[resources]
readme = "curriculum/incubator/stage-04/r17-bounded-rendered-filter/README.md"
check = "curriculum/incubator/stage-04/r17-bounded-rendered-filter/success-check"
host_check = "curriculum/incubator/stage-04/r17-bounded-rendered-filter/learner-host-check"
hint = "curriculum/incubator/stage-04/r17-bounded-rendered-filter/hint"
solution = "curriculum/incubator/stage-04/r17-bounded-rendered-filter/solution"

[verification]
timeout_seconds = 300
capabilities = []
tools = ["module-load-test", "read-result-test"]
cleanup_required = true

[[verification.cases]]
id = "bounded-read-filtering"
label = "Bounded read-result filtering"
expect_build = "pass"
check = "curriculum/incubator/stage-04/r17-bounded-rendered-filter/success-check"
build_output_contains = ""
[verification.cases.build_variables]
ROOTKITLINGS_FAIL_POINT = "0"

[[verification.cases]]
id = "missing-retained-path"
label = "Missing retained target"
expect_build = "pass"
check = "curriculum/incubator/stage-04/r17-bounded-rendered-filter/missing-path-check"
build_output_contains = ""
[verification.cases.build_variables]
ROOTKITLINGS_FAIL_POINT = "0"

[[verification.cases]]
id = "preflight-rejection"
label = "Preflight rejection"
expect_build = "pass"
check = "curriculum/incubator/stage-01/r04-proc-publication/failure-ecanceled-check"
build_output_contains = ""
[verification.cases.build_variables]
ROOTKITLINGS_FAIL_POINT = "1"

[[verification.cases]]
id = "publication-rollback"
label = "Proc publication rollback"
expect_build = "pass"
check = "curriculum/incubator/stage-04/r17-bounded-rendered-filter/probe-failure-check.in"
build_output_contains = ""
check_arguments = ["12", "Proc publication rollback"]
[verification.cases.build_variables]
ROOTKITLINGS_FAIL_POINT = "2"

[[verification.cases]]
id = "missing-probe-target"
label = "Missing vfs_read target rollback"
expect_build = "pass"
check = "curriculum/incubator/stage-04/r17-bounded-rendered-filter/probe-failure-check.in"
build_output_contains = ""
check_arguments = ["2", "Missing vfs_read target rollback"]
[verification.cases.build_variables]
ROOTKITLINGS_FAIL_POINT = "3"

[[verification.cases]]
id = "copy-in-failure"
label = "No-fault input copy rollback"
expect_build = "pass"
check = "curriculum/incubator/stage-04/r17-bounded-rendered-filter/copy-failure-check"
build_output_contains = ""
[verification.cases.build_variables]
ROOTKITLINGS_FAIL_POINT = "4"

[[verification.cases]]
id = "copy-out-failure"
label = "No-fault output copy rollback"
expect_build = "pass"
check = "curriculum/incubator/stage-04/r17-bounded-rendered-filter/copy-failure-check"
build_output_contains = ""
[verification.cases.build_variables]
ROOTKITLINGS_FAIL_POINT = "5"

[[verification.cases]]
id = "unknown-failure-point"
label = "Reject unknown failure point"
expect_build = "fail"
check = ""
build_output_contains = "unknown ROOTKITLINGS_FAIL_POINT"
[verification.cases.build_variables]
ROOTKITLINGS_FAIL_POINT = "99"
