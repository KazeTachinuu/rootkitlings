schema_version = 2
id = "packed-directory-filter"
title = "Filter packed directory records safely"
stage = "views-detection"
kind = "lesson"
status = "required"
tradecraft = ["concealment", "detection"]
difficulty = "advanced"
prerequisites = ["return-aware-syscall-telemetry", "cross-view-evidence"]
teaches = ["packed-record-validation", "overlap-safe-record-compaction", "directory-cookie-preservation", "false-eof-avoidance"]
requires = ["kretprobes", "nofault-user-copy", "kernel-allocation", "kernel-abi-contract", "managed-hook-lifecycle", "cross-view-evidence"]

[workspace]
mode = "cumulative"
files = ["Kbuild", "core/main.c", "core/state.c", "include/dirent_filter.h", "include/rootkit.h", "instrumentation/dirent_filter.c", "instrumentation/getdents_probe.c", "instrumentation/probes.c", "interface/hidden_proc.c", "interface/proc.c"]
editable = ["instrumentation/dirent_filter.c"]
build = "."
baseline = "scaffold"
module_artifact = "rootkitlings.ko"
source = "curriculum/incubator/stage-04/r16-packed-directory-filter/starter-overlay"
parent = "cross-view-evidence"

[resources]
readme = "curriculum/incubator/stage-04/r16-packed-directory-filter/README.md"
check = "curriculum/incubator/stage-04/r16-packed-directory-filter/success-check"
host_check = "curriculum/incubator/stage-04/r16-packed-directory-filter/host-check"
hint = "curriculum/incubator/stage-04/r16-packed-directory-filter/hint"
solution = "curriculum/incubator/stage-04/r16-packed-directory-filter/solution-overlay"

[verification]
timeout_seconds = 300
capabilities = []
tools = ["module-load-test", "proc-read-test", "proc-write-test", "getdents64-test"]
cleanup_required = true

[[verification.cases]]
id = "packed-record-filtering"
label = "Packed directory filtering"
expect_build = "pass"
check = "curriculum/incubator/stage-04/r16-packed-directory-filter/success-check"
build_output_contains = ""
[verification.cases.build_variables]
ROOTKITLINGS_FAIL_POINT = "0"

[[verification.cases]]
id = "preflight-rejection"
label = "Preflight rejection"
expect_build = "pass"
check = "curriculum/incubator/stage-01/r04-proc-publication/failure-ecanceled-check"
build_output_contains = ""
[verification.cases.build_variables]
ROOTKITLINGS_FAIL_POINT = "1"

[[verification.cases]]
id = "allocation-rejection"
label = "State allocation rejection"
expect_build = "pass"
check = "curriculum/incubator/stage-01/r04-proc-publication/failure-enomem-check"
build_output_contains = ""
[verification.cases.build_variables]
ROOTKITLINGS_FAIL_POINT = "2"

[[verification.cases]]
id = "public-proc-rollback"
label = "Public proc publication rollback"
expect_build = "pass"
check = "curriculum/incubator/stage-04/r16-packed-directory-filter/failure-check.in"
build_output_contains = ""
check_arguments = ["12", "Public proc publication rollback"]
[verification.cases.build_variables]
ROOTKITLINGS_FAIL_POINT = "3"

[[verification.cases]]
id = "inherited-probe-rollback"
label = "Inherited Kprobe batch rollback"
expect_build = "pass"
check = "curriculum/incubator/stage-04/r16-packed-directory-filter/failure-check.in"
build_output_contains = ""
check_arguments = ["2", "Inherited Kprobe batch rollback"]
[verification.cases.build_variables]
ROOTKITLINGS_FAIL_POINT = "4"

[[verification.cases]]
id = "missing-return-target-rollback"
label = "Missing iterate_dir target rollback"
expect_build = "pass"
check = "curriculum/incubator/stage-04/r16-packed-directory-filter/failure-check.in"
build_output_contains = ""
check_arguments = ["2", "Missing iterate_dir target rollback"]
[verification.cases.build_variables]
ROOTKITLINGS_FAIL_POINT = "5"

[[verification.cases]]
id = "hidden-proc-rollback"
label = "Hidden proc publication rollback"
expect_build = "pass"
check = "curriculum/incubator/stage-04/r16-packed-directory-filter/failure-check.in"
build_output_contains = ""
check_arguments = ["12", "Hidden proc publication rollback"]
[verification.cases.build_variables]
ROOTKITLINGS_FAIL_POINT = "6"

[[verification.cases]]
id = "unknown-failure-point"
label = "Reject unknown failure point"
expect_build = "fail"
check = ""
build_output_contains = "unknown ROOTKITLINGS_FAIL_POINT"
[verification.cases.build_variables]
ROOTKITLINGS_FAIL_POINT = "99"
