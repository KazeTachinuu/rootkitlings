schema_version = 2
id = "event-driven-kernel-thread"
title = "Run and stop an event-driven kernel thread"
stage = "control-execution"
kind = "lesson"
status = "required"
tradecraft = ["execution", "lifecycle"]
difficulty = "standard"
prerequisites = ["bounded-control-switch"]
teaches = ["kernel-threads", "wait-queues", "atomic-operations", "bounded-event-admission", "worker-stop-lifecycle"]
requires = ["error-pointers", "read-once-write-once", "action-control-switch", "state-invariant-selection"]

[workspace]
mode = "cumulative"
files = ["Kbuild", "core/main.c", "core/state.c", "include/rootkit.h", "interface/proc.c", "execution/worker.c"]
editable = ["Kbuild", "core/main.c", "interface/proc.c", "execution/worker.c"]
build = "."
baseline = "scaffold"
module_artifact = "rootkitlings.ko"
source = "curriculum/incubator/stage-02/r08-event-thread/template"
parent = "bounded-control-switch"

[resources]
readme = "curriculum/incubator/stage-02/r08-event-thread/README.md"
check = "curriculum/incubator/stage-02/r08-event-thread/success-check"
host_check = "curriculum/incubator/stage-02/r08-event-thread/host-check"
hint = "curriculum/incubator/stage-02/r08-event-thread/hint"
solution = "curriculum/incubator/stage-02/r08-event-thread/solution"

[verification]
timeout_seconds = 120
capabilities = []
tools = ["module-load-test", "proc-write-test", "run-as", "status-field-test"]
cleanup_required = true

[[verification.cases]]
id = "normal-worker"
label = "Event-driven worker lifecycle"
expect_build = "pass"
check = "curriculum/incubator/stage-02/r08-event-thread/success-check"
build_output_contains = ""

[verification.cases.build_variables]
ROOTKITLINGS_FAIL_POINT = "0"

[[verification.cases]]
id = "preflight-rejection"
label = "Preflight rejection"
expect_build = "pass"
check = "curriculum/incubator/stage-01/r04-proc-publication/failure-ecanceled-check"
build_output_contains = ""

[verification.cases.build_variables]
ROOTKITLINGS_FAIL_POINT = "1"

[[verification.cases]]
id = "allocation-rejection"
label = "State allocation rejection"
expect_build = "pass"
check = "curriculum/incubator/stage-01/r04-proc-publication/failure-enomem-check"
build_output_contains = ""

[verification.cases.build_variables]
ROOTKITLINGS_FAIL_POINT = "2"

[[verification.cases]]
id = "publication-rollback"
label = "Publication rollback"
expect_build = "pass"
check = "curriculum/incubator/stage-01/r04-proc-publication/failure-after-state-check"
build_output_contains = ""

[verification.cases.build_variables]
ROOTKITLINGS_FAIL_POINT = "3"

[[verification.cases]]
id = "publication-worker-cleanup"
label = "Worker cleanup after publication failure"
expect_build = "pass"
check = "curriculum/incubator/stage-02/r08-event-thread/publication-rollback-check"
build_output_contains = ""

[verification.cases.build_variables]
ROOTKITLINGS_FAIL_POINT = "3"

[[verification.cases]]
id = "worker-start-rejection"
label = "Worker creation rejection"
expect_build = "pass"
check = "curriculum/incubator/stage-02/r08-event-thread/failure-check"
build_output_contains = ""

[verification.cases.build_variables]
ROOTKITLINGS_FAIL_POINT = "4"

[[verification.cases]]
id = "unknown-failure-point"
label = "Reject unknown failure point"
expect_build = "fail"
check = ""
build_output_contains = "unknown ROOTKITLINGS_FAIL_POINT"

[verification.cases.build_variables]
ROOTKITLINGS_FAIL_POINT = "99"
