schema_version = 2
id = "proc-read-contract"
title = "Read module state through procfs"
stage = "control-execution"
kind = "lesson"
status = "required"
tradecraft = ["control", "detection"]
difficulty = "standard"
prerequisites = ["proc-publication"]
teaches = ["proc-read", "bounded-read-contract"]
requires = ["proc-entry", "component-ownership", "proc-publication-lifetime"]

[workspace]
mode = "cumulative"
files = ["Kbuild", "core/main.c", "core/state.c", "include/rootkit.h", "interface/proc.c"]
editable = ["core/main.c", "core/state.c", "include/rootkit.h", "interface/proc.c"]
build = "."
baseline = "scaffold"
module_artifact = "rootkitlings.ko"
source = "curriculum/incubator/stage-02/r05-proc-read/template"
parent = "proc-publication"

[resources]
readme = "curriculum/incubator/stage-02/r05-proc-read/README.md"
check = "curriculum/incubator/stage-02/r05-proc-read/success-check"
host_check = "curriculum/incubator/stage-02/r05-proc-read/host-check"
hint = "curriculum/incubator/stage-02/r05-proc-read/hint"
solution = "curriculum/incubator/stage-02/r05-proc-read/solution"

[verification]
timeout_seconds = 120
capabilities = []
tools = ["module-load-test", "proc-read-test"]
cleanup_required = true

[[verification.cases]]
id = "normal-read"
label = "Bounded procfs read"
expect_build = "pass"
check = "curriculum/incubator/stage-02/r05-proc-read/success-check"
build_output_contains = ""

[verification.cases.build_variables]
ROOTKITLINGS_FAIL_POINT = "0"

[[verification.cases]]
id = "preflight-rejection"
label = "Preflight rejection"
expect_build = "pass"
check = "curriculum/incubator/stage-01/r04-proc-publication/failure-ecanceled-check"
build_output_contains = ""

[verification.cases.build_variables]
ROOTKITLINGS_FAIL_POINT = "1"

[[verification.cases]]
id = "allocation-rejection"
label = "State allocation rejection"
expect_build = "pass"
check = "curriculum/incubator/stage-01/r04-proc-publication/failure-enomem-check"
build_output_contains = ""

[verification.cases.build_variables]
ROOTKITLINGS_FAIL_POINT = "2"

[[verification.cases]]
id = "publication-rollback"
label = "Publication rollback"
expect_build = "pass"
check = "curriculum/incubator/stage-01/r04-proc-publication/failure-after-state-check"
build_output_contains = ""

[verification.cases.build_variables]
ROOTKITLINGS_FAIL_POINT = "3"

[[verification.cases]]
id = "unknown-failure-point"
label = "Reject unknown failure point"
expect_build = "fail"
check = ""
build_output_contains = "unknown ROOTKITLINGS_FAIL_POINT"

[verification.cases.build_variables]
ROOTKITLINGS_FAIL_POINT = "99"
