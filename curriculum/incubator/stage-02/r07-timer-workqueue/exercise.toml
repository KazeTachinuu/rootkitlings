schema_version = 2
id = "timer-workqueue-scheduler"
title = "Defer timer work to a worker"
stage = "control-execution"
kind = "lesson"
status = "required"
tradecraft = ["execution", "lifecycle"]
difficulty = "standard"
prerequisites = ["bounded-control-switch"]
teaches = ["kernel-timers", "workqueues", "timer-to-worker-deferral", "deferred-work-lifecycle"]
requires = ["resource-ownership", "read-once-write-once", "action-control-switch", "state-invariant-selection"]

[workspace]
mode = "cumulative"
files = ["Kbuild", "core/main.c", "core/state.c", "include/rootkit.h", "interface/proc.c", "execution/scheduler.c"]
editable = ["Kbuild", "core/main.c", "execution/scheduler.c"]
build = "."
baseline = "scaffold"
module_artifact = "rootkitlings.ko"
source = "curriculum/incubator/stage-02/r07-timer-workqueue/template"
parent = "bounded-control-switch"

[resources]
readme = "curriculum/incubator/stage-02/r07-timer-workqueue/README.md"
check = "curriculum/incubator/stage-02/r07-timer-workqueue/success-check"
host_check = "curriculum/incubator/stage-02/r07-timer-workqueue/host-check"
hint = "curriculum/incubator/stage-02/r07-timer-workqueue/hint"
solution = "curriculum/incubator/stage-02/r07-timer-workqueue/solution"

[verification]
timeout_seconds = 120
capabilities = []
tools = ["module-load-test", "proc-write-test", "run-as", "status-field-test"]
cleanup_required = true

[[verification.cases]]
id = "normal-scheduler"
label = "Timer and workqueue lifecycle"
expect_build = "pass"
check = "curriculum/incubator/stage-02/r07-timer-workqueue/success-check"
build_output_contains = ""

[verification.cases.build_variables]
ROOTKITLINGS_FAIL_POINT = "0"

[[verification.cases]]
id = "preflight-rejection"
label = "Preflight rejection"
expect_build = "pass"
check = "curriculum/incubator/stage-01/r04-proc-publication/failure-ecanceled-check"
build_output_contains = ""

[verification.cases.build_variables]
ROOTKITLINGS_FAIL_POINT = "1"

[[verification.cases]]
id = "allocation-rejection"
label = "State allocation rejection"
expect_build = "pass"
check = "curriculum/incubator/stage-01/r04-proc-publication/failure-enomem-check"
build_output_contains = ""

[verification.cases.build_variables]
ROOTKITLINGS_FAIL_POINT = "2"

[[verification.cases]]
id = "publication-rollback"
label = "Publication rollback"
expect_build = "pass"
check = "curriculum/incubator/stage-01/r04-proc-publication/failure-after-state-check"
build_output_contains = ""

[verification.cases.build_variables]
ROOTKITLINGS_FAIL_POINT = "3"

[[verification.cases]]
id = "unknown-failure-point"
label = "Reject unknown failure point"
expect_build = "fail"
check = ""
build_output_contains = "unknown ROOTKITLINGS_FAIL_POINT"

[verification.cases.build_variables]
ROOTKITLINGS_FAIL_POINT = "99"
