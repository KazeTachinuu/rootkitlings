schema_version = 2
id = "controlled-resident-core"
title = "Unify timed and requested work"
stage = "control-execution"
kind = "milestone"
status = "required"
tradecraft = ["control", "execution", "lifecycle"]
difficulty = "standard"
prerequisites = ["timer-workqueue-scheduler", "event-driven-kernel-thread"]
teaches = ["resident-core-integration"]
requires = ["action-control-switch", "read-once-write-once", "fixed-command-grammar", "kernel-timers", "atomic-operations", "bounded-event-admission", "worker-stop-lifecycle"]

[workspace]
mode = "cumulative"
files = ["Kbuild", "core/main.c", "core/state.c", "include/rootkit.h", "interface/proc.c", "execution/worker.c", "execution/scheduler.c"]
editable = ["Kbuild", "core/main.c", "core/state.c", "include/rootkit.h", "interface/proc.c", "execution/worker.c", "execution/scheduler.c"]
build = "."
baseline = "cumulative-root"
module_artifact = "rootkitlings.ko"
additions = "curriculum/incubator/stage-02/m00-controlled-resident-core/additions"

[resources]
readme = "curriculum/incubator/stage-02/m00-controlled-resident-core/README.md"
check = "curriculum/incubator/stage-02/m00-controlled-resident-core/success-check"
host_check = "curriculum/incubator/stage-02/m00-controlled-resident-core/host-check"
hint = "curriculum/incubator/stage-02/m00-controlled-resident-core/hint"
solution = "curriculum/incubator/stage-02/m00-controlled-resident-core/solution"

[verification]
timeout_seconds = 240
capabilities = []
tools = ["module-load-test", "proc-write-test", "run-as", "status-field-test"]
cleanup_required = true

[[verification.cases]]
id = "normal-integration"
label = "Timed and requested work"
expect_build = "pass"
check = "curriculum/incubator/stage-02/m00-controlled-resident-core/success-check"
build_output_contains = ""

[verification.cases.build_variables]
ROOTKITLINGS_FAIL_POINT = "0"

[[verification.cases]]
id = "preflight-rejection"
label = "Preflight rejection"
expect_build = "pass"
check = "curriculum/incubator/stage-01/r04-proc-publication/failure-ecanceled-check"
build_output_contains = ""

[verification.cases.build_variables]
ROOTKITLINGS_FAIL_POINT = "1"

[[verification.cases]]
id = "allocation-rejection"
label = "State allocation rejection"
expect_build = "pass"
check = "curriculum/incubator/stage-01/r04-proc-publication/failure-enomem-check"
build_output_contains = ""

[verification.cases.build_variables]
ROOTKITLINGS_FAIL_POINT = "2"

[[verification.cases]]
id = "publication-rollback"
label = "Publication rollback"
expect_build = "pass"
check = "curriculum/incubator/stage-01/r04-proc-publication/failure-after-state-check"
build_output_contains = ""

[verification.cases.build_variables]
ROOTKITLINGS_FAIL_POINT = "3"

[[verification.cases]]
id = "publication-worker-cleanup"
label = "Worker cleanup after publication failure"
expect_build = "pass"
check = "curriculum/incubator/stage-02/m00-controlled-resident-core/publication-rollback-check"
build_output_contains = ""

[verification.cases.build_variables]
ROOTKITLINGS_FAIL_POINT = "3"

[[verification.cases]]
id = "worker-start-rejection"
label = "Worker creation rejection"
expect_build = "pass"
check = "curriculum/incubator/stage-02/m00-controlled-resident-core/failure-check"
build_output_contains = ""

[verification.cases.build_variables]
ROOTKITLINGS_FAIL_POINT = "4"

[[verification.cases]]
id = "unknown-failure-point"
label = "Reject unknown failure point"
expect_build = "fail"
check = ""
build_output_contains = "unknown ROOTKITLINGS_FAIL_POINT"

[verification.cases.build_variables]
ROOTKITLINGS_FAIL_POINT = "99"
