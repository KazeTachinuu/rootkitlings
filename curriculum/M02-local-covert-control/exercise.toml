schema_version = 2
id = "local-covert-control"
title = "Look at what you built"
stage = "reflection"
kind = "milestone"
tradecraft = ["control", "privilege", "concealment", "persistence"]
difficulty = "standard"
prerequisites = ["port-hiding"]
teaches = ["integration-verification"]
requires = []

[workspace]
mode = "project"
files = []
build = ""

[resources]
readme = "curriculum/M02-local-covert-control/README.md"
host_check = ""
hint = "curriculum/M02-local-covert-control/hint"
solution = ""

[verification]
timeout_seconds = 180
tools = ["module-load-test", "mkdir-escalation-test"]

[[verification.cases]]
id = "escalation"
label = "mkdir rklings.e escalates to root"
expect_build = "pass"
check = "curriculum/M02-local-covert-control/checks/escalation-check"

[[verification.cases]]
id = "persistence"
label = "mkdir rklings.persist and unpersist work"
expect_build = "pass"
check = "curriculum/M02-local-covert-control/checks/persist-check"

[[verification.cases]]
id = "module-cloak"
label = "mkdir rklings.h.m hides module from lsmod"
expect_build = "pass"
check = "curriculum/M02-local-covert-control/checks/cloak-check"

[[verification.cases]]
id = "file-hiding"
label = "mkdir rklings.h.f.PREFIX hides files from getdents"
expect_build = "pass"
check = "curriculum/M02-local-covert-control/checks/file-check"

[[verification.cases]]
id = "content-hiding"
label = "mkdir rklings.h.c.STRING hides matching lines"
expect_build = "pass"
check = "curriculum/M02-local-covert-control/checks/content-check"

[[verification.cases]]
id = "port-hiding"
label = "mkdir rklings.h.p.PORT hides port from /proc/net/tcp"
expect_build = "pass"
check = "curriculum/M02-local-covert-control/checks/port-check"
