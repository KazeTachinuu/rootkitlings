schema_version = 2
id = "local-covert-control"
title = "Local covert control via mkdir"
stage = "identity-observation"
kind = "milestone"
tradecraft = ["control", "privilege", "concealment"]
difficulty = "standard"
prerequisites = ["module-cloak", "transactional-credential-replacement"]
teaches = ["covert-syscall-channel", "local-privilege-escalation"]
requires = ["kprobes", "credential-replacement", "list-del-module-hiding"]

[workspace]
mode = "project"
files = ["Kbuild", "main.c"]
editable = ["main.c"]
build = "."
baseline = "starter"
source = "curriculum/M02-local-covert-control/starter"

[resources]
readme = "curriculum/M02-local-covert-control/README.md"
host_check = ""
hint = "curriculum/M02-local-covert-control/hint"
solution = "curriculum/M02-local-covert-control/solution"

[verification]
timeout_seconds = 120
tools = ["module-load-test", "mkdir-escalation-test"]

[[verification.cases]]
id = "local-control"
label = "mkdir commands control the rootkit"
expect_build = "pass"
check = "curriculum/M02-local-covert-control/checks/success-check"

[[verification.cases]]
id = "escalation"
label = "Unprivileged user escalates to root"
expect_build = "pass"
check = "curriculum/M02-local-covert-control/checks/escalation-check"
