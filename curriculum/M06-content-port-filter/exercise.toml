schema_version = 2
id = "content-port-filter"
title = "Content and port hiding"
stage = "advanced-hiding"
kind = "milestone"
tradecraft = ["concealment", "instrumentation"]
difficulty = "advanced"
prerequisites = ["tcp-port-filter", "bounded-line-filter", "dynamic-directory-filter"]
teaches = ["dynamic-content-hiding", "dynamic-port-hiding"]
requires = ["kretprobes", "tcp-seq-show-suppression", "dynamic-target-list"]

[workspace]
mode = "project"
files = ["Kbuild", "main.c", "target_list.h", "target_list.c"]
editable = ["main.c"]
build = "."
baseline = "starter"
source = "curriculum/M06-content-port-filter/starter"

[resources]
readme = "curriculum/M06-content-port-filter/README.md"
host_check = ""
hint = "curriculum/M06-content-port-filter/hint"
solution = "curriculum/M06-content-port-filter/solution"

[verification]
timeout_seconds = 120
tools = ["module-load-test", "proc-write-test", "read-result-test"]

[[verification.cases]]
id = "content-hiding"
label = "Content lines hidden from vfs_read"
expect_build = "pass"
check = "curriculum/M06-content-port-filter/checks/content-check"

[[verification.cases]]
id = "port-hiding"
label = "Ports hidden from /proc/net/tcp"
expect_build = "pass"
check = "curriculum/M06-content-port-filter/checks/port-check"
