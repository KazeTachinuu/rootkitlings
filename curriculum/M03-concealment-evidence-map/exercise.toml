schema_version = 2
id = "concealment-evidence-map"
title = "Hide one process listing and map the blind spot"
stage = "views-detection"
kind = "milestone"
status = "required"
tradecraft = ["concealment", "detection"]
difficulty = "advanced"
prerequisites = ["authorized-actions-telemetry", "packed-directory-filter"]
teaches = ["namespace-aware-process-view-filtering", "machine-readable-evidence-map"]
requires = ["authorized-telemetry-integration", "packed-record-validation", "directory-cookie-preservation", "cross-view-evidence", "namespace-id-translation", "resource-ownership", "proc-publication-lifetime"]

[workspace]
mode = "cumulative"
files = ["Kbuild", "core/main.c", "core/state.c", "include/rootkit.h", "interface/proc.c", "execution/worker.c", "execution/scheduler.c", "control/authorization.c", "privilege/credentials.c", "instrumentation/events.c", "instrumentation/return_probe.c", "include/dirent_filter.h", "instrumentation/dirent_filter.c", "instrumentation/getdents_probe.c", "interface/evidence.c"]
editable = ["Kbuild", "include/rootkit.h", "core/main.c", "execution/worker.c", "instrumentation/getdents_probe.c", "interface/evidence.c"]
build = "."
baseline = "parent"
parent = "authorized-actions-telemetry"
additions = "curriculum/M03-concealment-evidence-map/starter"
imports = [
  { exercise = "packed-directory-filter", files = ["include/dirent_filter.h", "instrumentation/dirent_filter.c"] },
]

[resources]
readme = "curriculum/M03-concealment-evidence-map/README.md"
check = "curriculum/M03-concealment-evidence-map/checks/success-check"
host_check = "curriculum/M03-concealment-evidence-map/checks/host-check"
hint = "curriculum/M03-concealment-evidence-map/hint"
solution = "curriculum/M03-concealment-evidence-map/solution"

[verification]
timeout_seconds = 300
capabilities = []
tools = ["module-load-test", "getdents64-test", "event-stream-test", "status-field-test", "proc-write-test", "proc-read-test", "credential-trigger-test", "rmdir-telemetry-test", "run-as"]
cleanup_required = true

[[verification.cases]]
id = "process-view-and-evidence"
label = "Process view and evidence map"
expect_build = "pass"
check = "curriculum/M03-concealment-evidence-map/checks/success-check"
build_output_contains = ""
[verification.cases.build_variables]
ROOTKITLINGS_FAIL_POINT = "0"

[[verification.cases]]
id = "m02-regression"
label = "Authorized actions and telemetry regression"
expect_build = "pass"
check = "curriculum/M02-authorized-actions-telemetry/checks/success-check"
build_output_contains = ""
[verification.cases.build_variables]
ROOTKITLINGS_FAIL_POINT = "0"

