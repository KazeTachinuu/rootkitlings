schema_version = 2
id = "bounded-control-switch"
title = "Add an operator control switch"
stage = "control-execution"
kind = "lesson"
tradecraft = ["control"]
difficulty = "standard"
prerequisites = ["proc-read-contract"]
teaches = ["proc-write", "bounded-user-copy", "copy-validate-commit", "fixed-command-grammar", "read-once-write-once", "state-invariant-selection", "action-control-switch"]
requires = ["proc-read", "bounded-read-contract", "component-ownership", "proc-publication-lifetime"]

[workspace]
mode = "cumulative"
files = ["Kbuild", "core/main.c", "core/state.c", "include/rootkit.h", "interface/proc.c"]
editable = ["core/state.c", "include/rootkit.h", "interface/proc.c"]
build = "."
baseline = "scaffold"
source = "curriculum/L05-bounded-control-switch/starter"
parent = "proc-read-contract"

[resources]
readme = "curriculum/L05-bounded-control-switch/README.md"
host_check = "curriculum/L05-bounded-control-switch/checks/host-check"
hint = "curriculum/L05-bounded-control-switch/hint"
solution = "curriculum/L05-bounded-control-switch/solution"

[verification]
timeout_seconds = 120
tools = ["module-load-test", "proc-write-test", "run-as"]

[[verification.cases]]
id = "normal-control"
label = "Bounded control commands"
expect_build = "pass"
check = "curriculum/L05-bounded-control-switch/checks/success-check"

[verification.cases.build_variables]
ROOTKITLINGS_FAIL_POINT = "0"

[[verification.cases]]
id = "preflight-rejection"
label = "Preflight rejection"
expect_build = "pass"
check = "curriculum/L03-proc-publication/checks/failure-ecanceled-check"

[verification.cases.build_variables]
ROOTKITLINGS_FAIL_POINT = "1"

[[verification.cases]]
id = "allocation-rejection"
label = "State allocation rejection"
expect_build = "pass"
check = "curriculum/L03-proc-publication/checks/failure-enomem-check"

[verification.cases.build_variables]
ROOTKITLINGS_FAIL_POINT = "2"

[[verification.cases]]
id = "publication-rollback"
label = "Publication rollback"
expect_build = "pass"
check = "curriculum/L03-proc-publication/checks/failure-after-state-check"

[verification.cases.build_variables]
ROOTKITLINGS_FAIL_POINT = "3"

[[verification.cases]]
id = "unknown-failure-point"
label = "Reject unknown failure point"
expect_build = "fail"
build_output_contains = "unknown ROOTKITLINGS_FAIL_POINT"

[verification.cases.build_variables]
ROOTKITLINGS_FAIL_POINT = "99"
