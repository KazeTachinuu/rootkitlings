schema_version = 2
id = "full-protocol"
title = "Wire all commands to the encrypted protocol"
stage = "operations"
kind = "lesson"
tradecraft = ["control"]
difficulty = "standard"
prerequisites = ["remote-control"]
teaches = ["full-command-wiring", "protocol-parity"]
requires = []

[workspace]
mode = "project"
files = [
    "Kbuild",
    "include/rootkit.h",
    "core/init.c",
    "core/target.c",
    "core/filter.c",
    "core/opsec.c",
    "crypto/envelope.c",
    "network/protocol.c",
    "network/agent.c",
    "execution/dispatch.c",
    "execution/commands.c",
    "execution/shell.c",
]
editable = [
    "include/rootkit.h",
    "core/init.c",
    "core/target.c",
    "core/filter.c",
    "core/opsec.c",
    "crypto/envelope.c",
    "network/protocol.c",
    "network/agent.c",
    "execution/dispatch.c",
    "execution/commands.c",
    "execution/shell.c",
]
build = "."
baseline = "starter"
source = "curriculum/L25-full-protocol/starter"

[resources]
readme = "curriculum/L25-full-protocol/README.md"
host_check = ""
hint = "curriculum/L25-full-protocol/hint"
solution = "curriculum/L25-full-protocol/solution"

[verification]
timeout_seconds = 180
tools = ["module-load-test", "secure-agent-fixture"]

[[verification.cases]]
id = "full-protocol"
label = "All commands wired to encrypted protocol"
expect_build = "pass"
check = "curriculum/L25-full-protocol/checks/full-protocol"
