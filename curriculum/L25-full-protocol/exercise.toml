schema_version = 2
id = "full-protocol"
title = "Wire all commands to the encrypted protocol"
stage = "operations"
kind = "lesson"
tradecraft = ["control"]
difficulty = "standard"
prerequisites = ["command-parser"]
teaches = ["full-command-wiring", "protocol-parity"]
requires = []

[workspace]
mode = "project"
files = ["Kbuild", "main.c"]
editable = ["main.c"]
build = "."
baseline = "starter"
source = "curriculum/L25-full-protocol/starter"

[resources]
readme = "curriculum/L25-full-protocol/README.md"
host_check = ""
hint = "curriculum/L25-full-protocol/hint"
solution = "curriculum/L25-full-protocol/solution"

[verification]
timeout_seconds = 120
tools = ["module-load-test"]

[[verification.cases]]
id = "full-protocol"
label = "All commands wired to encrypted protocol"
expect_build = "pass"
check = "vm/checks/module-loads"
check_arguments = ["control_key=000102030405060708090a0b0c0d0e0f101112131415161718191a1b1c1d1e1f"]
