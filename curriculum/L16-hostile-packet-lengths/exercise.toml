schema_version = 2
id = "hostile-packet-lengths"
title = "Reject deceptive IPv4 lengths"
stage = "network-state"
kind = "lesson"
tradecraft = ["networking", "detection"]
difficulty = "standard"
prerequisites = []
teaches = ["packet-length-validation", "network-byte-order-decoding", "ipv4-fragment-policy"]
requires = ["ipv4-packet-basics"]

[workspace]
mode = "project"
files = ["Kbuild", "include/ipv4_parser.h", "main.c", "parser/ipv4.c"]
editable = ["parser/ipv4.c"]
build = "."
baseline = "starter"
source = "curriculum/L16-hostile-packet-lengths/starter"

[resources]
readme = "curriculum/L16-hostile-packet-lengths/README.md"
host_check = "curriculum/L16-hostile-packet-lengths/checks/host-check"
hint = "curriculum/L16-hostile-packet-lengths/hint"
solution = "curriculum/L16-hostile-packet-lengths/solution"

[verification]
timeout_seconds = 180
tools = []

[[verification.cases]]
id = "bounded-ipv4-parser"
label = "Kernel parser self-test and sanitized host corpus"
expect_build = "pass"
check = "curriculum/L16-hostile-packet-lengths/checks/success-check"
