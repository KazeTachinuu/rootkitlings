schema_version = 2
id = "authenticated-dns-signal"
title = "Send an authenticated DNS-shaped status flare"
stage = "authenticated-operations"
kind = "milestone"
tradecraft = ["networking", "cryptography", "detection"]
difficulty = "advanced"
prerequisites = ["cross-view-evidence", "kernel-socket-ownership", "bounded-dns-wire-name", "authenticated-replay-safe-message"]
teaches = ["authenticated-dns-signals", "paired-network-detection"]
requires = ["cross-view-evidence", "socket-lifecycle", "dns-wire-encoding", "hmac-authentication", "replay-resistant-state"]

[workspace]
mode = "project"
files = ["Kbuild", "core/main.c", "crypto/auth_platform.c", "include/authenticated.h", "include/authenticated_dns.h", "include/dns_query.h", "include/auth_platform.h", "include/selftest.h", "include/transport.h", "message/authenticated.c", "signal/authenticated_dns.c", "tests/selftest.c", "transport/udp.c", "wire/dns_query.c"]
editable = ["signal/authenticated_dns.c"]
build = "."
baseline = "scaffold"
parent = "authenticated-replay-safe-message"
source = "curriculum/M08-authenticated-dns-signal/starter"

[resources]
readme = "curriculum/M08-authenticated-dns-signal/README.md"
host_check = "curriculum/M08-authenticated-dns-signal/checks/host-check"
hint = "curriculum/M08-authenticated-dns-signal/hint"
solution = "curriculum/M08-authenticated-dns-signal/solution"

[verification]
timeout_seconds = 360
tools = ["module-load-test", "module-load-params"]

[[verification.cases]]
id = "authenticated-dns-signal"
label = "Authenticated DNS-shaped signal"
expect_build = "pass"
check = "curriculum/M08-authenticated-dns-signal/checks/success-check"
[verification.cases.build_variables]
ROOTKITLINGS_FAIL_POINT = "0"

[[verification.cases]]
id = "invalid-status"
label = "Reject an out-of-range signal status"
expect_build = "pass"
check = "curriculum/M08-authenticated-dns-signal/checks/invalid-parameter-check"
[verification.cases.build_variables]
ROOTKITLINGS_FAIL_POINT = "0"

[[verification.cases]]
id = "context-allocation-failure"
label = "Signal authentication context allocation failure"
expect_build = "pass"
check = "curriculum/M08-authenticated-dns-signal/checks/failure-check"
check_arguments = ["12", "Signal authentication context allocation failure"]
[verification.cases.build_variables]
ROOTKITLINGS_FAIL_POINT = "1"

[[verification.cases]]
id = "key-setup-failure"
label = "Signal HMAC key setup failure"
expect_build = "pass"
check = "curriculum/M08-authenticated-dns-signal/checks/failure-check"
check_arguments = ["129", "Signal HMAC key setup failure"]
[verification.cases.build_variables]
ROOTKITLINGS_FAIL_POINT = "2"

[[verification.cases]]
id = "digest-failure"
label = "Signal HMAC calculation failure"
expect_build = "pass"
check = "curriculum/M08-authenticated-dns-signal/checks/failure-check"
check_arguments = ["5", "Signal HMAC calculation failure"]
[verification.cases.build_variables]
ROOTKITLINGS_FAIL_POINT = "3"

[[verification.cases]]
id = "unknown-failure-point"
label = "Reject unknown failure point"
expect_build = "fail"
build_output_contains = "must be between 0 and 3"
[verification.cases.build_variables]
ROOTKITLINGS_FAIL_POINT = "99"
