schema_version = 2
id = "file-hiding"
title = "Hide one name from a directory listing"
stage = "views-detection"
kind = "lesson"
tradecraft = ["concealment", "detection"]
difficulty = "advanced"
prerequisites = ["command-dispatcher"]
teaches = ["packed-record-validation", "overlap-safe-record-compaction", "directory-cookie-preservation", "false-eof-avoidance"]
requires = ["kretprobes", "nofault-user-copy", "kernel-allocation", "kernel-abi-contract", "managed-hook-lifecycle", "cross-view-evidence"]

[workspace]
mode = "cumulative"
files = ["Kbuild", "core/main.c", "core/state.c", "include/dirent_filter.h", "include/rootkit.h", "instrumentation/dirent_filter.c", "instrumentation/getdents_probe.c", "instrumentation/probes.c", "interface/hidden_proc.c", "interface/proc.c"]
editable = ["instrumentation/dirent_filter.c"]
build = "."
baseline = "scaffold"
source = "curriculum/L12-file-hiding/starter"
parent = "command-dispatcher"

[resources]
readme = "curriculum/L12-file-hiding/README.md"
host_check = "curriculum/L12-file-hiding/checks/host-check"
hint = "curriculum/L12-file-hiding/hint"
solution = "curriculum/L12-file-hiding/solution"

[verification]
timeout_seconds = 300
tools = ["module-load-test", "proc-read-test", "proc-write-test", "getdents64-test"]

[[verification.cases]]
id = "packed-record-filtering"
label = "Packed directory filtering"
expect_build = "pass"
check = "curriculum/L12-file-hiding/checks/success-check"
[verification.cases.build_variables]
RKLINGS_FAIL_POINT = "0"

[[verification.cases]]
id = "preflight-rejection"
label = "Preflight rejection"
expect_build = "pass"
check = "curriculum/L03-proc-publication/checks/failure-ecanceled-check"
[verification.cases.build_variables]
RKLINGS_FAIL_POINT = "1"

[[verification.cases]]
id = "allocation-rejection"
label = "State allocation rejection"
expect_build = "pass"
check = "curriculum/L03-proc-publication/checks/failure-enomem-check"
[verification.cases.build_variables]
RKLINGS_FAIL_POINT = "2"

[[verification.cases]]
id = "public-proc-rollback"
label = "Public proc publication rollback"
expect_build = "pass"
check = "curriculum/L12-file-hiding/checks/failure-check.in"
check_arguments = ["12", "Public proc publication rollback"]
[verification.cases.build_variables]
RKLINGS_FAIL_POINT = "3"

[[verification.cases]]
id = "inherited-probe-rollback"
label = "Inherited Kprobe batch rollback"
expect_build = "pass"
check = "curriculum/L12-file-hiding/checks/failure-check.in"
check_arguments = ["2", "Inherited Kprobe batch rollback"]
[verification.cases.build_variables]
RKLINGS_FAIL_POINT = "4"

[[verification.cases]]
id = "missing-return-target-rollback"
label = "Missing iterate_dir target rollback"
expect_build = "pass"
check = "curriculum/L12-file-hiding/checks/failure-check.in"
check_arguments = ["2", "Missing iterate_dir target rollback"]
[verification.cases.build_variables]
RKLINGS_FAIL_POINT = "5"

[[verification.cases]]
id = "hidden-proc-rollback"
label = "Hidden proc publication rollback"
expect_build = "pass"
check = "curriculum/L12-file-hiding/checks/failure-check.in"
check_arguments = ["12", "Hidden proc publication rollback"]
[verification.cases.build_variables]
RKLINGS_FAIL_POINT = "6"

[[verification.cases]]
id = "unknown-failure-point"
label = "Reject unknown failure point"
expect_build = "fail"
build_output_contains = "unknown RKLINGS_FAIL_POINT"
[verification.cases.build_variables]
RKLINGS_FAIL_POINT = "99"
