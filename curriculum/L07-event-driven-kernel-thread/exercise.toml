schema_version = 2
id = "event-driven-kernel-thread"
title = "Wake a sleeping kernel worker"
stage = "control-execution"
kind = "lesson"
tradecraft = ["execution", "lifecycle"]
difficulty = "standard"
prerequisites = ["bounded-control-switch"]
teaches = ["kernel-threads", "wait-queues", "atomic-operations", "bounded-event-admission", "worker-stop-lifecycle"]
requires = ["error-pointers", "read-once-write-once", "action-control-switch", "state-invariant-selection"]

[workspace]
mode = "cumulative"
files = ["Kbuild", "core/main.c", "core/state.c", "include/rootkit.h", "interface/proc.c", "execution/worker.c"]
editable = ["Kbuild", "core/main.c", "interface/proc.c", "execution/worker.c"]
build = "."
baseline = "scaffold"
source = "curriculum/L07-event-driven-kernel-thread/starter"
parent = "bounded-control-switch"

[resources]
readme = "curriculum/L07-event-driven-kernel-thread/README.md"
host_check = "curriculum/L07-event-driven-kernel-thread/checks/host-check"
hint = "curriculum/L07-event-driven-kernel-thread/hint"
solution = "curriculum/L07-event-driven-kernel-thread/solution"

[verification]
timeout_seconds = 120
tools = ["module-load-test", "proc-write-test", "run-as", "status-field-test"]

[[verification.cases]]
id = "normal-worker"
label = "Event-driven worker lifecycle"
expect_build = "pass"
check = "curriculum/L07-event-driven-kernel-thread/checks/success-check"

[verification.cases.build_variables]
RKLINGS_FAIL_POINT = "0"

[[verification.cases]]
id = "preflight-rejection"
label = "Preflight rejection"
expect_build = "pass"
check = "curriculum/L03-proc-publication/checks/failure-ecanceled-check"

[verification.cases.build_variables]
RKLINGS_FAIL_POINT = "1"

[[verification.cases]]
id = "allocation-rejection"
label = "State allocation rejection"
expect_build = "pass"
check = "curriculum/L03-proc-publication/checks/failure-enomem-check"

[verification.cases.build_variables]
RKLINGS_FAIL_POINT = "2"

[[verification.cases]]
id = "publication-rollback"
label = "Publication rollback"
expect_build = "pass"
check = "curriculum/L03-proc-publication/checks/failure-after-state-check"

[verification.cases.build_variables]
RKLINGS_FAIL_POINT = "3"

[[verification.cases]]
id = "publication-worker-cleanup"
label = "Worker cleanup after publication failure"
expect_build = "pass"
check = "curriculum/L07-event-driven-kernel-thread/checks/publication-rollback-check"

[verification.cases.build_variables]
RKLINGS_FAIL_POINT = "3"

[[verification.cases]]
id = "worker-start-rejection"
label = "Worker creation rejection"
expect_build = "pass"
check = "curriculum/L07-event-driven-kernel-thread/checks/failure-check"

[verification.cases.build_variables]
RKLINGS_FAIL_POINT = "4"

[[verification.cases]]
id = "unknown-failure-point"
label = "Reject unknown failure point"
expect_build = "fail"
build_output_contains = "unknown RKLINGS_FAIL_POINT"

[verification.cases.build_variables]
RKLINGS_FAIL_POINT = "99"
