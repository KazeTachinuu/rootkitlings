schema_version = 2
id = "remote-control"
title = "Full protocol over the encrypted agent connection"
stage = "reflection"
kind = "milestone"
tradecraft = ["control", "network", "crypto", "concealment"]
difficulty = "standard"
prerequisites = ["shell-timeout", "file-download", "command-parser", "local-control"]
teaches = ["remote-protocol-integration"]
requires = []

[workspace]
mode = "project"
files = [
    "Kbuild",
    "include/rootkit.h",
    "core/init.c",
    "core/target.c",
    "core/filter.c",
    "core/opsec.c",
    "crypto/envelope.c",
    "network/protocol.c",
    "network/agent.c",
    "execution/dispatch.c",
    "execution/commands.c",
    "execution/shell.c",
]
editable = [
    "execution/dispatch.c",
    "execution/commands.c",
]
build = "."
baseline = "starter"
source = "curriculum/M04-remote-control/starter"

[resources]
readme = "curriculum/M04-remote-control/README.md"
host_check = ""
hint = "curriculum/M04-remote-control/hint"
solution = "curriculum/M04-remote-control/solution"

[verification]
timeout_seconds = 120
tools = ["module-load-test"]

[[verification.cases]]
id = "remote-hide"
label = "HIDE FILE command hides a file over encrypted channel"
expect_build = "pass"
check = "curriculum/M04-remote-control/checks/remote-hide"
check_arguments = ["peer_address=127.0.0.1", "peer_port=4444"]

[[verification.cases]]
id = "remote-shell"
label = "SHELL command opens interactive shell via protocol"
expect_build = "pass"
check = "curriculum/M04-remote-control/checks/remote-shell"
check_arguments = ["peer_address=127.0.0.1", "peer_port=4444"]

[[verification.cases]]
id = "remote-download"
label = "DOWNLOAD command exfiltrates file encrypted"
expect_build = "pass"
check = "curriculum/M04-remote-control/checks/remote-download"
check_arguments = ["peer_address=127.0.0.1", "peer_port=4444"]
