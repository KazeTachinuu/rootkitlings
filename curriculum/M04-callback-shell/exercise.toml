schema_version = 2
id = "callback-shell"
title = "Call home and open a root shell"
stage = "network-state"
kind = "milestone"
tradecraft = ["control", "execution", "privilege", "networking"]
difficulty = "advanced"
prerequisites = ["root-shell-bridge"]
teaches = ["connect-back-agent", "beacon-jitter"]
requires = ["kernel-sockets", "root-shell-execution"]

[workspace]
mode = "project"
files = [
  "Kbuild",
  "core/main.c",
  "include/agent.h",
  "include/framing.h",
  "include/protocol.h",
  "include/root_shell.h",
  "network/agent.c",
  "network/framing.c",
  "network/protocol.c",
  "execution/root_shell.c",
]
editable = ["core/main.c", "network/agent.c"]
build = "."
baseline = "starter"
source = "curriculum/M04-callback-shell/starter"

[resources]
readme = "curriculum/M04-callback-shell/README.md"
host_check = ""
hint = "curriculum/M04-callback-shell/hint"
solution = "curriculum/M04-callback-shell/solution"

[runtime]
setup = "vm/runtime/callback-shell"

[verification]
timeout_seconds = 300
tools = ["agent-fixture", "module-load-params"]

[[verification.cases]]
id = "callback-shell"
label = "Agent connects and opens root shell"
expect_build = "pass"
check = "curriculum/M04-callback-shell/checks/success-check"

[[verification.cases]]
id = "reconnect"
label = "Agent reconnects after disconnect"
expect_build = "pass"
check = "curriculum/M04-callback-shell/checks/reconnect-check"
