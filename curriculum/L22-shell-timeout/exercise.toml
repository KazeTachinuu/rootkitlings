schema_version = 2
id = "shell-timeout"
title = "Add shell timeouts and an exec slot"
stage = "protocol"
kind = "lesson"
tradecraft = ["network"]
difficulty = "standard"
prerequisites = ["shell-redirect"]
teaches = ["delayed-work", "inactivity-timeout", "exec-slot"]
requires = []

[workspace]
mode = "project"
files = ["Kbuild", "main.c"]
editable = ["main.c"]
build = "."
baseline = "starter"
source = "curriculum/L22-shell-timeout/starter"

[resources]
readme = "curriculum/L22-shell-timeout/README.md"
host_check = ""
hint = "curriculum/L22-shell-timeout/hint"
solution = "curriculum/L22-shell-timeout/solution"

[verification]
timeout_seconds = 120
tools = ["module-load-test"]

[[verification.cases]]
id = "timeout-fires"
label = "Shell auto-killed after inactivity timeout"
expect_build = "pass"
check = "curriculum/L22-shell-timeout/checks/timeout-fires"

[[verification.cases]]
id = "exec-slot"
label = "Exec slot runs one-shot command and releases"
expect_build = "pass"
check = "curriculum/L22-shell-timeout/checks/exec-slot"
