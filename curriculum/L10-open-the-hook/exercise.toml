schema_version = 2
id = "open-the-hook"
title = "Open rklings_hook.h and understand it"
stage = "interception"
kind = "lesson"
tradecraft = ["hooking", "syscall-interception"]
difficulty = "standard"
prerequisites = ["pid-escalation"]
teaches = ["kretprobe", "pt-regs-extraction", "syscall-interception"]
requires = ["kretprobes"]

[workspace]
mode = "cumulative"
files = ["Kbuild", "main.c"]
editable = ["main.c"]
build = "."
baseline = "starter"
source = "curriculum/L10-open-the-hook/starter"
parent = "pid-escalation"

[resources]
readme = "curriculum/L10-open-the-hook/README.md"
hint = "curriculum/L10-open-the-hook/hint"
solution = "curriculum/L10-open-the-hook/solution"

[verification]
timeout_seconds = 120

[[verification.cases]]
id = "escalation"
label = "mkdir rklings.e grants root (no header)"
expect_build = "pass"

[[verification.cases]]
id = "pid-escalation"
label = "mkdir rklings.e.PID escalates target"
expect_build = "pass"

[[verification.cases]]
id = "no-header"
label = "Code does not include rklings_hook.h"
expect_build = "pass"
