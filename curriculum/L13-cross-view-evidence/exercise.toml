schema_version = 2
id = "cross-view-evidence"
title = "Keep a live probe off the status page"
stage = "views-detection"
kind = "lesson"
tradecraft = ["detection", "concealment"]
difficulty = "standard"
prerequisites = ["managed-kprobe"]
teaches = ["cross-view-evidence", "positive-negative-controls", "seq-file-item-suppression"]
requires = ["proc-read", "kprobes"]

[workspace]
mode = "cumulative"
files = ["Kbuild", "core/main.c", "core/state.c", "include/rootkit.h", "instrumentation/probes.c", "interface/proc.c"]
editable = ["interface/proc.c"]
build = "."
baseline = "scaffold"
source = "curriculum/L13-cross-view-evidence/starter"
parent = "managed-kprobe"

[resources]
readme = "curriculum/L13-cross-view-evidence/README.md"
host_check = "curriculum/L13-cross-view-evidence/checks/learner-host-check"
hint = "curriculum/L13-cross-view-evidence/hint"
solution = "curriculum/L13-cross-view-evidence/solution"

[verification]
timeout_seconds = 240
tools = ["module-load-test", "proc-read-test", "proc-write-test", "run-as"]

[[verification.cases]]
id = "selected-view-suppression"
label = "Cross-view probe evidence"
expect_build = "pass"
check = "curriculum/L13-cross-view-evidence/checks/success-check"
[verification.cases.build_variables]
RKLINGS_FAIL_POINT = "0"

[[verification.cases]]
id = "preflight-rejection"
label = "Preflight rejection"
expect_build = "pass"
check = "curriculum/L03-proc-publication/checks/failure-ecanceled-check"
[verification.cases.build_variables]
RKLINGS_FAIL_POINT = "1"

[[verification.cases]]
id = "allocation-rejection"
label = "State allocation rejection"
expect_build = "pass"
check = "curriculum/L03-proc-publication/checks/failure-enomem-check"
[verification.cases.build_variables]
RKLINGS_FAIL_POINT = "2"

[[verification.cases]]
id = "publication-rollback"
label = "Probe cleanup after procfs publication failure"
expect_build = "pass"
check = "curriculum/L13-cross-view-evidence/checks/probe-failure-check.in"
check_arguments = ["12", "Probe cleanup after procfs publication failure"]
[verification.cases.build_variables]
RKLINGS_FAIL_POINT = "3"

[[verification.cases]]
id = "missing-target-rollback"
label = "Batch rollback after a missing second symbol"
expect_build = "pass"
check = "curriculum/L13-cross-view-evidence/checks/probe-failure-check.in"
check_arguments = ["2", "Batch rollback after a missing second symbol"]
[verification.cases.build_variables]
RKLINGS_FAIL_POINT = "4"

[[verification.cases]]
id = "unknown-failure-point"
label = "Reject unknown failure point"
expect_build = "fail"
build_output_contains = "unknown RKLINGS_FAIL_POINT"
[verification.cases.build_variables]
RKLINGS_FAIL_POINT = "99"
