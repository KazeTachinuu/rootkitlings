schema_version = 2
id = "complete-rootkit"
title = "Assemble and verify the complete rootkit"
stage = "final-project"
kind = "final-project"
tradecraft = [
  "lifecycle",
  "control",
  "execution",
  "privilege",
  "instrumentation",
  "concealment",
  "networking",
  "boot-staging",
  "cryptography",
]
difficulty = "challenge"
prerequisites = [
  "content-port-filter",
  "authenticated-channel",
  "local-covert-control",
  "reversible-persistence",
]
teaches = ["complete-rootkit-integration"]
requires = []

[workspace]
mode = "project"
files = [
  "Kbuild",
  "core/main.c",
  "crypto/aead.c",
  "crypto/aead_platform.c",
  "execution/root_shell.c",
  "include/aead.h",
  "include/aead_platform.h",
  "include/agent.h",
  "include/framing.h",
  "include/protocol.h",
  "include/root_shell.h",
  "include/secure_control.h",
  "include/target_list.h",
  "network/agent.c",
  "network/framing.c",
  "network/protocol.c",
  "security/control.c",
  "target_list.c",
]
editable = ["core/main.c"]
build = "."
baseline = "starter"
source = "curriculum/C00-complete-rootkit/starter"

[resources]
readme = "curriculum/C00-complete-rootkit/README.md"
host_check = ""
hint = "curriculum/C00-complete-rootkit/hint"
solution = "curriculum/C00-complete-rootkit/solution"

[runtime]
setup = "vm/runtime/complete-rootkit"

[verification]
timeout_seconds = 600
tools = [
  "secure-agent-fixture",
  "module-load-params",
]

[[verification.cases]]
id = "complete-rootkit"
label = "Complete course rootkit"
expect_build = "pass"
check = "curriculum/C00-complete-rootkit/checks/success-check"
