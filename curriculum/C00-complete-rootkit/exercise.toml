schema_version = 2
id = "complete-rootkit"
title = "Assemble and verify the complete rootkit"
stage = "final-project"
kind = "final-project"
tradecraft = [
  "lifecycle",
  "control",
  "execution",
  "privilege",
  "instrumentation",
  "concealment",
  "networking",
  "boot-staging",
  "cryptography",
  "detection",
]
difficulty = "challenge"
prerequisites = [
  "bounded-rendered-filter",
  "writable-packet-mutation",
  "authenticated-reverse-shell",
]
teaches = ["complete-rootkit-integration"]
requires = [
  "resident-core-integration",
  "authorized-telemetry-integration",
  "namespace-aware-process-view-filtering",
  "boot-load-request",
  "remote-agent-integration",
  "packet-redirection",
  "packet-copy-on-write",
  "checksum-repair",
  "authenticated-encryption",
  "replay-resistant-state",
  "sensitive-state-zeroization",
  "authenticated-reverse-shell",
  "machine-readable-evidence-map",
  "bounded-rendered-filter",
  "binary-safe-equal-width-replacement",
]

[workspace]
mode = "cumulative"
files = [
  "Kbuild",
  "access/skb_access.c",
  "classifier/udp.c",
  "control/authorization.c",
  "core/main.c",
  "core/state.c",
  "crypto/aead.c",
  "crypto/aead_platform.c",
  "execution/scheduler.c",
  "execution/root_shell.c",
  "execution/worker.c",
  "include/aead.h",
  "include/aead_platform.h",
  "include/agent.h",
  "include/agent_status.h",
  "include/dirent_filter.h",
  "include/framing.h",
  "include/ipv4.h",
  "include/ipv4_parser.h",
  "include/packet_redirect.h",
  "include/platform.h",
  "include/protocol.h",
  "include/provision.h",
  "include/replace.h",
  "include/rootkit.h",
  "include/root_shell.h",
  "include/skb_access.h",
  "include/secure_control.h",
  "include/transaction.h",
  "include/udp_classifier.h",
  "include/udp_redirect.h",
  "include/visibility.h",
  "include/writable.h",
  "instrumentation/dirent_filter.c",
  "instrumentation/events.c",
  "instrumentation/getdents_probe.c",
  "instrumentation/netfilter_observer.c",
  "instrumentation/replace.c",
  "instrumentation/return_probe.c",
  "interface/agent_status.c",
  "interface/evidence.c",
  "interface/proc.c",
  "mutation/udp_redirect.c",
  "mutation/writable.c",
  "network/agent.c",
  "network/framing.c",
  "network/ipv4.c",
  "network/protocol.c",
  "parser/ipv4.c",
  "staging/platform.c",
  "staging/transaction.c",
  "privilege/credentials.c",
  "security/control.c",
  "security/provision.c",
  "security/clear.c",
]
editable = [
  "Kbuild",
  "core/main.c",
]
build = "."
baseline = "parent"
parent = "authenticated-reverse-shell"
additions = "curriculum/C00-complete-rootkit/starter"

[[workspace.imports]]
exercise = "writable-packet-mutation"
files = [
  "access/skb_access.c",
  "classifier/udp.c",
  "include/ipv4_parser.h",
  "include/packet_redirect.h",
  "include/skb_access.h",
  "include/udp_classifier.h",
  "include/udp_redirect.h",
  "include/writable.h",
  "instrumentation/netfilter_observer.c",
  "mutation/udp_redirect.c",
  "mutation/writable.c",
  "parser/ipv4.c",
]

[[workspace.imports]]
exercise = "bounded-rendered-filter"
files = [
  "include/replace.h",
  "instrumentation/replace.c",
]

[resources]
readme = "curriculum/C00-complete-rootkit/README.md"
host_check = "curriculum/C00-complete-rootkit/checks/host-check"
hint = "curriculum/C00-complete-rootkit/hint"
solution = "curriculum/C00-complete-rootkit/solution"

[play]
profile = "complete-rootkit"
script = "vm/play/complete-rootkit"

[verification]
timeout_seconds = 600
tools = [
  "secure-agent-fixture",
  "module-load-params",
  "getdents64-test",
  "read-result-test",
  "packet-mutation-test",
  "event-stream-test",
  "status-field-test",
  "proc-write-test",
  "proc-read-test",
  "credential-trigger-test",
  "rmdir-telemetry-test",
  "run-as",
]

[[verification.cases]]
id = "complete-rootkit"
label = "Complete course rootkit"
expect_build = "pass"
check = "curriculum/C00-complete-rootkit/checks/success-check"
[verification.cases.build_variables]
ROOTKITLINGS_FAIL_POINT = "0"

[[verification.cases]]
id = "authorized-actions-regression"
label = "Credential action and syscall telemetry"
expect_build = "pass"
check = "curriculum/M02-authorized-actions-telemetry/checks/success-check"
check_arguments = ["complete-rootkit"]
[verification.cases.build_variables]
ROOTKITLINGS_FAIL_POINT = "0"

[[verification.cases]]
id = "selected-view-concealment"
label = "Selected-view concealment and evidence"
expect_build = "pass"
check = "curriculum/C00-complete-rootkit/checks/visibility-check"
[verification.cases.build_variables]
ROOTKITLINGS_FAIL_POINT = "0"

[[verification.cases]]
id = "control-provisioning-regression"
