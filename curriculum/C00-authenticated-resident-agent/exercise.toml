schema_version = 2
id = "authenticated-resident-agent"
title = "Complete and verify the course rootkit"
stage = "authenticated-operations"
kind = "capstone"
status = "required"
tradecraft = [
  "lifecycle",
  "control",
  "execution",
  "privilege",
  "instrumentation",
  "concealment",
  "networking",
  "persistence",
  "cryptography",
  "detection",
]
difficulty = "challenge"
prerequisites = [
  "remote-resident-agent",
  "authenticated-encryption",
  "authenticated-dns-signal",
]
teaches = ["complete-rootkit-integration"]
requires = [
  "resident-core-integration",
  "authorized-telemetry-integration",
  "namespace-aware-process-view-filtering",
  "boot-load-persistence",
  "remote-agent-integration",
  "authenticated-encryption",
  "replay-resistant-state",
  "sensitive-state-zeroization",
  "authenticated-dns-signals",
  "machine-readable-evidence-map",
]

[workspace]
mode = "cumulative"
files = [
  "Kbuild",
  "control/authorization.c",
  "core/main.c",
  "core/state.c",
  "crypto/aead.c",
  "crypto/aead_platform.c",
  "crypto/auth_platform.c",
  "execution/scheduler.c",
  "execution/worker.c",
  "include/aead.h",
  "include/aead_platform.h",
  "include/agent.h",
  "include/agent_status.h",
  "include/authenticated.h",
  "include/authenticated_dns.h",
  "include/dirent_filter.h",
  "include/dns_query.h",
  "include/framing.h",
  "include/platform.h",
  "include/protocol.h",
  "include/rootkit.h",
  "include/secure_control.h",
  "include/status_signal.h",
  "include/transaction.h",
  "include/transport.h",
  "instrumentation/dirent_filter.c",
  "instrumentation/events.c",
  "instrumentation/getdents_probe.c",
  "instrumentation/return_probe.c",
  "interface/agent_status.c",
  "interface/evidence.c",
  "interface/proc.c",
  "message/authenticated.c",
  "network/agent.c",
  "network/framing.c",
  "network/protocol.c",
  "persistence/platform.c",
  "persistence/transaction.c",
  "privilege/credentials.c",
  "security/control.c",
  "signal/authenticated_dns.c",
  "signal/status.c",
  "transport/udp.c",
  "wire/dns_query.c",
]
editable = [
  "Kbuild",
  "core/main.c",
  "include/agent.h",
  "include/framing.h",
  "include/platform.h",
  "network/agent.c",
  "security/control.c",
]
build = "."
baseline = "previous-milestone"
additions = "curriculum/C00-authenticated-resident-agent/starter"

[resources]
readme = "curriculum/C00-authenticated-resident-agent/README.md"
check = "curriculum/C00-authenticated-resident-agent/checks/success-check"
host_check = "curriculum/C00-authenticated-resident-agent/checks/host-check"
hint = "curriculum/C00-authenticated-resident-agent/hint"
solution = "curriculum/C00-authenticated-resident-agent/solution"

[verification]
timeout_seconds = 600
capabilities = []
tools = [
  "secure-agent-fixture",
  "module-load-params",
  "getdents64-test",
  "event-stream-test",
  "status-field-test",
  "proc-write-test",
  "proc-read-test",
  "credential-trigger-test",
  "rmdir-telemetry-test",
  "run-as",
]
cleanup_required = true

[[verification.cases]]
id = "complete-rootkit"
label = "Complete course rootkit"
expect_build = "pass"
check = "curriculum/C00-authenticated-resident-agent/checks/success-check"
build_output_contains = ""
[verification.cases.build_variables]
ROOTKITLINGS_FAIL_POINT = "0"

[[verification.cases]]
id = "concealment-evidence-regression"
label = "Process view, evidence, and local control"
expect_build = "pass"
check = "curriculum/M02-concealment-evidence-map/checks/success-check"
check_arguments = ["authenticated-agent"]
build_output_contains = ""
[verification.cases.build_variables]
ROOTKITLINGS_FAIL_POINT = "0"

[[verification.cases]]
id = "authorized-actions-regression"
label = "Credential action and syscall telemetry"
expect_build = "pass"
check = "curriculum/M01-authorized-actions-telemetry/checks/success-check"
check_arguments = ["authenticated-agent"]
build_output_contains = ""
[verification.cases.build_variables]
ROOTKITLINGS_FAIL_POINT = "0"

