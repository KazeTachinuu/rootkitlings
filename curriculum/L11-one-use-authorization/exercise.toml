schema_version = 2
id = "one-use-authorization"
title = "Authorize one credential change with a fresh token"
stage = "identity-observation"
kind = "lesson"
status = "required"
tradecraft = ["privilege", "control", "cryptography"]
difficulty = "standard"
prerequisites = ["transactional-credential-replacement"]
teaches = ["kernel-randomness", "one-use-authorization", "authorization-vs-authentication", "replay-rejection", "mutexes", "mutex-protected-invariants", "bounded-typed-parsing", "sensitive-state-zeroization"]
requires = ["credential-replacement", "action-control-switch", "resource-ownership"]

[workspace]
mode = "cumulative"
files = ["Kbuild", "core/main.c", "core/state.c", "include/rootkit.h", "interface/proc.c", "privilege/credentials.c", "control/authorization.c"]
editable = ["control/authorization.c"]
build = "."
baseline = "scaffold"
source = "curriculum/L11-one-use-authorization/starter"
parent = "transactional-credential-replacement"

[resources]
readme = "curriculum/L11-one-use-authorization/README.md"
check = "curriculum/L11-one-use-authorization/checks/success-check"
host_check = "curriculum/L11-one-use-authorization/checks/learner-host-check"
hint = "curriculum/L11-one-use-authorization/hint"
solution = "curriculum/L11-one-use-authorization/solution"

[verification]
timeout_seconds = 180
capabilities = []
tools = ["module-load-test", "credential-trigger-test", "proc-write-test", "run-as"]
cleanup_required = true

[[verification.cases]]
id = "normal-authorization"
label = "Fresh-token authorization"
expect_build = "pass"
check = "curriculum/L11-one-use-authorization/checks/success-check"
build_output_contains = ""

[verification.cases.build_variables]
ROOTKITLINGS_FAIL_POINT = "0"

[[verification.cases]]
id = "preflight-rejection"
label = "Preflight rejection"
expect_build = "pass"
check = "curriculum/L03-proc-publication/checks/failure-ecanceled-check"
build_output_contains = ""

[verification.cases.build_variables]
ROOTKITLINGS_FAIL_POINT = "1"

[[verification.cases]]
id = "allocation-rejection"
label = "State allocation rejection"
expect_build = "pass"
check = "curriculum/L03-proc-publication/checks/failure-enomem-check"
build_output_contains = ""

[verification.cases.build_variables]
ROOTKITLINGS_FAIL_POINT = "2"

[[verification.cases]]
id = "publication-rollback"
label = "Publication rollback"
expect_build = "pass"
check = "curriculum/L03-proc-publication/checks/failure-after-state-check"
build_output_contains = ""

[verification.cases.build_variables]
ROOTKITLINGS_FAIL_POINT = "3"

[[verification.cases]]
id = "credential-prepare-rejection"
label = "Credential preparation rejection"
expect_build = "pass"
check = "curriculum/L11-one-use-authorization/checks/credential-failure-check.in"
build_output_contains = ""
check_arguments = ["12", "Credential preparation failure"]

[verification.cases.build_variables]
ROOTKITLINGS_FAIL_POINT = "4"

[[verification.cases]]
id = "credential-cancel-rejection"
label = "Credential cancellation"
expect_build = "pass"
check = "curriculum/L11-one-use-authorization/checks/credential-failure-check.in"
build_output_contains = ""
check_arguments = ["125", "Credential cancellation"]

[verification.cases.build_variables]
ROOTKITLINGS_FAIL_POINT = "5"

[[verification.cases]]
id = "unknown-failure-point"
label = "Reject unknown failure point"
expect_build = "fail"
check = ""
build_output_contains = "unknown ROOTKITLINGS_FAIL_POINT"

[verification.cases.build_variables]
ROOTKITLINGS_FAIL_POINT = "99"
