schema_version = 2
id = "proc-read-contract"
title = "Read live module state from procfs"
stage = "control-execution"
kind = "lesson"
tradecraft = ["control", "detection"]
difficulty = "standard"
prerequisites = ["proc-publication"]
teaches = ["proc-read", "bounded-read-contract"]
requires = ["proc-entry", "component-ownership", "proc-publication-lifetime"]

[workspace]
mode = "cumulative"
files = ["Kbuild", "core/main.c", "core/state.c", "include/rootkit.h", "interface/proc.c"]
editable = ["core/main.c", "core/state.c", "include/rootkit.h", "interface/proc.c"]
build = "."
baseline = "scaffold"
source = "curriculum/L04-proc-read-contract/starter"
parent = "proc-publication"

[resources]
readme = "curriculum/L04-proc-read-contract/README.md"
host_check = "curriculum/L04-proc-read-contract/checks/host-check"
hint = "curriculum/L04-proc-read-contract/hint"
solution = "curriculum/L04-proc-read-contract/solution"

[verification]
timeout_seconds = 120
tools = ["module-load-test", "proc-read-test"]

[[verification.cases]]
id = "normal-read"
label = "Bounded procfs read"
expect_build = "pass"
check = "curriculum/L04-proc-read-contract/checks/success-check"

[verification.cases.build_variables]
ROOTKITLINGS_FAIL_POINT = "0"

[[verification.cases]]
id = "preflight-rejection"
label = "Preflight rejection"
expect_build = "pass"
check = "curriculum/L03-proc-publication/checks/failure-ecanceled-check"

[verification.cases.build_variables]
ROOTKITLINGS_FAIL_POINT = "1"

[[verification.cases]]
id = "allocation-rejection"
label = "State allocation rejection"
expect_build = "pass"
check = "curriculum/L03-proc-publication/checks/failure-enomem-check"

[verification.cases.build_variables]
ROOTKITLINGS_FAIL_POINT = "2"

[[verification.cases]]
id = "publication-rollback"
label = "Publication rollback"
expect_build = "pass"
check = "curriculum/L03-proc-publication/checks/failure-after-state-check"

[verification.cases.build_variables]
ROOTKITLINGS_FAIL_POINT = "3"

[[verification.cases]]
id = "unknown-failure-point"
label = "Reject unknown failure point"
expect_build = "fail"
build_output_contains = "unknown ROOTKITLINGS_FAIL_POINT"

[verification.cases.build_variables]
ROOTKITLINGS_FAIL_POINT = "99"
