schema_version = 2
id = "root-shell-spawn"
title = "Spawn a root shell from the kernel"
stage = "network"
kind = "lesson"
tradecraft = ["network", "privilege"]
difficulty = "standard"
prerequisites = ["kernel-socket", "mkdir-escalation"]
teaches = ["usermodehelper", "kernel-userspace-spawn"]
requires = []

[workspace]
mode = "project"
files = ["Kbuild", "main.c"]
editable = ["main.c"]
build = "."
baseline = "starter"
source = "curriculum/L16-root-shell-spawn/starter"

[resources]
readme = "curriculum/L16-root-shell-spawn/README.md"
host_check = ""
hint = "curriculum/L16-root-shell-spawn/hint"
solution = "curriculum/L16-root-shell-spawn/solution"

[verification]
timeout_seconds = 120
tools = ["module-load-test"]

[[verification.cases]]
id = "root-spawn"
label = "Spawned process runs as root"
expect_build = "pass"
check = "vm/checks/module-loads"
