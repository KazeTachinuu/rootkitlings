schema_version = 2
id = "aead-encrypt"
title = "Encrypt and authenticate with the real kernel AEAD API"
stage = "crypto"
kind = "lesson"
tradecraft = ["crypto"]
difficulty = "standard"
prerequisites = ["message-framing"]
teaches = ["kernel-crypto-api", "aead-encryption", "scatterlist"]
requires = []

[workspace]
mode = "project"
files = ["Kbuild", "main.c"]
editable = ["main.c"]
build = "."
baseline = "starter"
source = "curriculum/L19-aead-encrypt/starter"

[resources]
readme = "curriculum/L19-aead-encrypt/README.md"
host_check = ""
hint = "curriculum/L19-aead-encrypt/hint"
solution = "curriculum/L19-aead-encrypt/solution"

[verification]
timeout_seconds = 120
tools = ["module-load-test"]

[[verification.cases]]
id = "aead-seal-open"
label = "AEAD seal and open round-trip"
expect_build = "pass"
check = "vm/checks/module-loads"
