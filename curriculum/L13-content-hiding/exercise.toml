schema_version = 2
id = "content-hiding"
title = "Remove matching lines from a file read"
stage = "views-detection"
kind = "lesson"
tradecraft = ["concealment", "detection"]
difficulty = "advanced"
prerequisites = ["file-hiding"]
teaches = ["line-removal-filter", "bounded-rendered-filter"]
requires = ["kretprobes", "nofault-user-copy", "kernel-abi-contract", "managed-hook-lifecycle", "cross-view-evidence"]

[workspace]
mode = "cumulative"
files = [
  "Kbuild",
  "core/main.c",
  "include/replace.h",
  "include/rootkit.h",
  "instrumentation/read_filter.c",
  "instrumentation/replace.c",
  "interface/proc.c",
]
editable = ["instrumentation/replace.c"]
build = "."
baseline = "starter"
source = "curriculum/L13-content-hiding/starter"

[resources]
readme = "curriculum/L13-content-hiding/README.md"
host_check = "curriculum/L13-content-hiding/checks/learner-host-check"
hint = "curriculum/L13-content-hiding/hint"
solution = "curriculum/L13-content-hiding/solution"

[verification]
timeout_seconds = 300
tools = ["module-load-test", "read-result-test"]

[[verification.cases]]
id = "bounded-line-removal"
label = "Bounded line removal"
expect_build = "pass"
check = "curriculum/L13-content-hiding/checks/success-check"
[verification.cases.build_variables]
RKLINGS_FAIL_POINT = "0"

[[verification.cases]]
id = "missing-retained-path"
label = "Missing retained target"
expect_build = "pass"
check = "curriculum/L13-content-hiding/checks/missing-path-check"
[verification.cases.build_variables]
RKLINGS_FAIL_POINT = "0"

[[verification.cases]]
id = "preflight-rejection"
label = "Preflight rejection"
expect_build = "pass"
check = "curriculum/L03-proc-publication/checks/failure-ecanceled-check"
[verification.cases.build_variables]
RKLINGS_FAIL_POINT = "1"

[[verification.cases]]
id = "publication-rollback"
label = "Proc publication rollback"
expect_build = "pass"
check = "curriculum/L13-content-hiding/checks/probe-failure-check.in"
check_arguments = ["12", "Proc publication rollback"]
[verification.cases.build_variables]
RKLINGS_FAIL_POINT = "2"

[[verification.cases]]
id = "missing-probe-target"
label = "Missing vfs_read target rollback"
expect_build = "pass"
check = "curriculum/L13-content-hiding/checks/probe-failure-check.in"
check_arguments = ["2", "Missing vfs_read target rollback"]
[verification.cases.build_variables]
RKLINGS_FAIL_POINT = "3"

[[verification.cases]]
id = "copy-in-failure"
label = "No-fault input copy rollback"
expect_build = "pass"
check = "curriculum/L13-content-hiding/checks/copy-failure-check"
[verification.cases.build_variables]
RKLINGS_FAIL_POINT = "4"

[[verification.cases]]
id = "copy-out-failure"
label = "No-fault output copy rollback"
expect_build = "pass"
check = "curriculum/L13-content-hiding/checks/copy-failure-check"
[verification.cases.build_variables]
RKLINGS_FAIL_POINT = "5"

[[verification.cases]]
id = "unknown-failure-point"
label = "Reject unknown failure point"
expect_build = "fail"
build_output_contains = "unknown RKLINGS_FAIL_POINT"
[verification.cases.build_variables]
RKLINGS_FAIL_POINT = "99"
