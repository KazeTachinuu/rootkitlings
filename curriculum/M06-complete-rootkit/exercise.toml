schema_version = 2
id = "complete-rootkit"
title = "Everything works locally and remotely, encrypted"
stage = "final-integration"
kind = "milestone"
tradecraft = [
  "lifecycle",
  "control",
  "execution",
  "privilege",
  "instrumentation",
  "concealment",
  "networking",
  "boot-staging",
  "cryptography",
]
difficulty = "advanced"
prerequisites = [
  "auto-opsec",
  "authenticated-channel",
  "local-covert-control",
  "reversible-persistence",
]
teaches = ["full-integration-verification"]
requires = []

[workspace]
mode = "project"
files = []
build = ""

[resources]
readme = "curriculum/M06-complete-rootkit/README.md"
host_check = ""
hint = "curriculum/M06-complete-rootkit/hint"
solution = ""

[verification]
timeout_seconds = 300
tools = ["module-load-test", "mkdir-escalation-test", "secure-agent-fixture"]

[[verification.cases]]
id = "local-commands"
label = "All mkdir commands work locally"
expect_build = "pass"
check = "curriculum/M06-complete-rootkit/checks/local-check"

[[verification.cases]]
id = "remote-commands"
label = "Wire protocol commands work over encrypted channel"
expect_build = "pass"
check = "curriculum/M06-complete-rootkit/checks/remote-check"

[[verification.cases]]
id = "encryption"
label = "All traffic is AES-256-GCM encrypted"
expect_build = "pass"
check = "curriculum/M06-complete-rootkit/checks/encryption-check"

[[verification.cases]]
id = "clean-shutdown"
label = "Clean unload with no kernel faults"
expect_build = "pass"
check = "curriculum/M06-complete-rootkit/checks/shutdown-check"
